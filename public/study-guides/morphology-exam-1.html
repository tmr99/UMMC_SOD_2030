  traps:[
    ["Central–lateral size relationship flips by arch","Maxillary laterals are smaller than maxillary centrals. Mandibular laterals are larger than mandibular centrals. The mandibular central is the smallest tooth in the mouth."],
    ["Wider labiolingually, not mesiodistally","Mandibular incisors are wider labiolingually than mesiodistally at the height of contour — the reverse of the maxillary incisors, where the lecture flags mesiodistal as wider."],
    ["Symmetry separates central from lateral","The mandibular central is bilaterally symmetrical, so the incisal view shows identical mesial and distal halves. The lateral's crown appears twisted on the root, with the cingulum and cervical line offset distally."],
    ["One antagonist","The mandibular central incisor occludes with only one tooth, the maxillary central — the same exception listed in the Form & Function two-antagonist rule."],
    ["Root depression is deeper on the distal","On the mandibular central, the mesial root concavity is slight and the distal is more pronounced."],
    ["Least distinct developmental grooves","The mandibular central has less distinct developmental grooves and imbrication lines than any other tooth, and the flattest lingual surface of any tooth."]
  ],
  questions:[
    {q:"Which teeth are the smallest in the mouth?",o:["Maxillary lateral incisors","Mandibular central incisors","Mandibular lateral incisors","Maxillary central incisors"],a:1,e:"The mandibular central incisors are the smallest permanent teeth. Note that within the mandibular arch, the laterals are slightly larger than the centrals."},
    {q:"In the mandibular arch, how do the lateral incisors compare with the centrals?",o:["Laterals are smaller","Laterals are larger","They are identical in size","Laterals are smaller in crown but larger in root"],a:1,e:"Mandibular laterals are slightly larger in all respects. This is the reverse of the maxillary arch, where laterals are smaller than centrals."},
    {q:"At the height of contour, mandibular incisors are:",o:["Wider mesiodistally than labiolingually","Wider labiolingually than mesiodistally","Equal in both dimensions","Variable depending on wear"],a:1,e:"Wider labiolingually than mesiodistally — the opposite of the maxillary incisors, which the maxillary lecture flags as wider mesiodistally."},
    {q:"The mandibular central incisor erupts at approximately:",o:["6–7 years","7–8 years","8–9 years","9–10 years"],a:0,e:"6–7 years for the central, with root completion at 9 years. The mandibular lateral erupts at 7–8 years with root completion at 10 years."},
    {q:"Which tooth has the flattest lingual surface of any tooth in the mouth?",o:["Maxillary central incisor","Mandibular central incisor","Mandibular canine","Maxillary lateral incisor"],a:1,e:"The mandibular central incisor. Its lingual is relatively smooth with less prominent features than the maxillary, and the lingual fossa is shallow."},
    {q:"The mandibular central incisor occludes with how many opposing teeth?",o:["One — the maxillary central incisor","Two — the maxillary central and lateral","Two — the maxillary lateral and canine","None in normal occlusion"],a:0,e:"It is one of the two exceptions to the two-antagonist rule, along with the maxillary third molar."},
    {q:"The small cingulum of the mandibular central incisor is formed from:",o:["The middle facial lobe","The fourth lobe","The mesial marginal ridge","The mamelons"],a:1,e:"The lingual, or fourth, lobe forms the cingulum. All incisors have four lobes: three facial and one lingual."},
    {q:"From the incisal view, the mandibular central incisor shows:",o:["A cingulum displaced to the distal","Bilateral symmetry, with the mesial half identical to the distal half","A crown twisted on the root","An incisal edge sloping lingually in the distal portion"],a:1,e:"The central is symmetrical. The distally displaced cingulum, twisted crown and lingually sloping distal incisal edge all describe the lateral."},
    {q:"On the mandibular central incisor, where is the height of contour on the proximal surfaces?",o:["Cervical third","Middle third","Incisal third, near the edge","At the CEJ"],a:2,e:"Incisal third near the edge on the proximal surfaces. The facial and lingual heights of contour are in the cervical third."},
    {q:"Compared with the mesial, the root concavity on the distal of a mandibular central incisor is:",o:["Absent","Less pronounced","More pronounced","Identical"],a:2,e:"The mesial root concavity is slight and the distal is more pronounced — the same asymmetry the mandibular lateral shows."},
    {q:"The developmental grooves and imbrication lines of the mandibular central incisor are:",o:["More distinct than on any other tooth","Less distinct than on any other tooth","Identical to the maxillary central","Present only on the lingual"],a:1,e:"They are less distinct than on any other tooth, which is part of why this tooth is described as the least variable and most regular."},
    {q:"From the mesial view of a mandibular central incisor, the incisal edge:",o:["Is directly in line with the long axis","Tilts toward the lingual, with the root axis line lingual to center","Tilts toward the facial","Is displaced distally"],a:1,e:"The incisal edge tilts lingually. This is consistent with the arch trait that mandibular incisor facial surfaces have a slight lingual slope."},
    {q:"On the distal surface of a mandibular central incisor, the cervical line curves incisally:",o:["About 1 mm more than the mesial","About 1 mm less than the mesial","The same as the mesial","It curves apically instead"],a:1,e:"About 1 mm less, following the general rule that cervical line curvature is greater on the mesial than the distal of any tooth."},
    {q:"Which feature is characteristic of the mandibular LATERAL incisor?",o:["Perfect bilateral symmetry","The cingulum and cervical line offset to the distal","Less distinct developmental grooves than any other tooth","Sharp mesioincisal and distoincisal angles of equal sharpness"],a:1,e:"The lateral's cingulum and cervical line are offset distally, the distoincisal angle is more rounded, and the crown appears twisted on the root."},
    {q:"Which incisor occasionally presents with a bifurcated root?",o:["Maxillary central","Maxillary lateral","Mandibular central","Mandibular lateral"],a:3,e:"The lecture notes that a bifurcated root is occasionally seen on the mandibular lateral incisor."},
    {q:"On the mandibular lateral incisor, the heights of contour on the mesial and distal are located:",o:["Mesial incisal third, distal middle third","Both in the incisal third","Both in the middle third","Mesial middle third, distal incisal third"],a:1,e:"Both mesial and distal heights of contour are in the incisal third on the mandibular lateral."},
    {q:"Comparing arch traits, mandibular incisors have:",o:["More prominent marginal ridges than maxillary","Almost no marginal ridges compared with maxillary","Identical marginal ridge development to maxillary","Marginal ridges only on the facial surface"],a:1,e:"Mandibular incisors have almost no marginal ridges, while maxillary incisors have more prominent ones along with a more developed cingulum and lingual fossa."},
    {q:"In normal occlusion, the facial incisal edges of the mandibular incisors occlude with:",o:["The facial surfaces of the maxillary incisors","The lingual surfaces of the maxillary incisors","The incisal edges of the maxillary incisors","The cingula of the maxillary canines"],a:1,e:"Mandibular facial incisal edges meet maxillary lingual surfaces; reciprocally, the maxillary lingual incisal edge occludes with the facial of the mandibular central and lateral."},
    {q:"Which root is longest among the four incisor types listed in the size comparison?",o:["Maxillary central, 13 mm","Maxillary lateral, 13 mm","Mandibular central, 12.5 mm","Mandibular lateral, 14 mm"],a:3,e:"The mandibular lateral averages 14 mm. The mandibular central has the shortest root of the four at 12.5 mm."},
    {q:"The mesiodistal root width at the CEJ is smallest on which tooth?",o:["Maxillary central at 7 mm","Maxillary lateral at 5 mm","Mandibular central at 3.5 mm","Mandibular lateral at 4.0 mm"],a:2,e:"3.5 mm on the mandibular central. This narrow root dimension is part of what makes mandibular incisor roots so slender relative to maxillary."}
  ]

{

  short:"Canines",
  source:"Maxillary and mandibular, 2022",
  blurb:"The cornerstones of the arch. Maxillary and mandibular canines side by side — chronology, cusp ridges, lingual anatomy, and the wear pattern that reverses the cusp ridge relationship.",
  sections:[
    {h:"Maxillary canine — chronology and measurements", table:{head:["","Maxillary canine","Mandibular canine"],rows:[

      ["Eruption","11–12 years","9–10 years"],

      ["Mesiodistal crown diameter","7.5 mm","7 mm"],
      ["Labiolingual crown diameter","8 mm","7.5 mm"]
    ]}},
    {h:"Maxillary canine — general form", rules:[
      "Four lobes — three facial, one lingual.",
      "The middle lobe is largest, followed by the distal in size, so the lobe ranking is middle > distal > mesial.",

      "Usually the last succedaneous tooth to erupt."

    {h:"Maxillary canine — facial view", rules:[
      "Mesial and distal developmental depressions are present.",

      "The mesial cusp ridge is shorter than the distal cusp ridge.",
      "The cusp tip is in line with the long axis of the tooth and with the root apex.",
      "The distoincisal angle is more rounded than the mesioincisal angle.",
      "Mesial outline — convex from the CEJ to the contact area at the junction of the middle and incisal third.",
      "Distal outline — concave between the CEJ and the contact area in the middle third.",
      "Height of contour: mesial at the junction of the incisal and middle thirds, distal in the middle third. The mesial contact is positioned more incisally than the distal contact.",
      "Narrower mesiodistally than the maxillary central incisor. The facial height of contour is in the cervical third.",
      "The root is conical with a blunt apex. It may be straight or curve to the distal or mesial in the apical third, with distal curvature more common if present. Labial root surfaces are smooth and convex at all points."
    ],
    callout:"Because of functional wear, the mesial cusp ridge becomes longer than the distal cusp ridge over time — the reverse of the newly erupted relationship."},
    {h:"Maxillary canine — lingual view", rules:[
      "Well developed cingulum, very convex.",
      "Prominent mesial and distal marginal ridges.",
      "The root tapers to the lingual.",
      "A prominent lingual ridge separates the mesial and distal fossae, and shallow fossae separate the marginal ridges from the lingual ridge.",
      "More pronounced curve at the CEJ area on the distal.",
      "Height of contour is closer to the CEJ on the distal.",
      "Generally a mirror of the facial surface, with the crown and root tapering slightly."
    ]},
    {h:"Maxillary canine — proximal views", rules:[
      "Mesial — the apex and cusp tip are slightly facial to a line bisecting the tooth faciolingually, with a shallow developmental depression along the root length.",
      "Distal — similar form to the mesial. The CEJ shows less curvature toward the cusp tip, the distal marginal ridge is more irregular in outline, the cervical third is slightly concave, and the fluting on the root is deeper."

    {h:"Maxillary canine — incisal view", rules:[
      "Wider faciolingually than mesiodistally.",
      "The mesial half of the crown is smoothly convex, and the mesiofacial line angle is quite prominent.",
      "The distal half is narrower faciolingually than the mesial half.",
      "The distal appears stretched to make contact with the first premolar, due to a deep distofacial depression on the labial and a curved distal marginal ridge.",
      "The cusp tip is slightly mesial and labial of center."
    ]},
    {h:"Mandibular canine — general form", rules:[
      "Four lobes — three facial, one lingual, with the middle lobe most prominent.",
      "The cingulum is less prominent than on the maxillary canine.",
      "The cusp ridges are thinner faciolingually than the maxillary.",
      "The cusp tip and ridges make up one quarter to one fifth of the crown length.",
      "The cusp tip is more pointed than the maxillary on eruption."

    {h:"Mandibular canine — labial view", rules:[
      "The mesial outline is straighter than that of the maxillary canine.",
      "The distal outline is convex in the incisal and middle thirds and concave in the cervical third.",
      "The distal cusp ridge is longer than the mesial cusp ridge.",
      "The root is usually straight with a sharply pointed apex.",
      "The mesioincisal angle is obtuse and less convex than the distoincisal.",
      "Height of contour: mesial in the incisal third, distal in the middle third."

    {h:"Mandibular canine — lingual and proximal", rules:[
      "The lingual surface is flatter than the maxillary, with a less developed cingulum.",
      "From the proximal view, the crown is shorter on the lingual than on the facial.",
      "The lingual portion of the root is narrower compared to the maxillary canine.",
      "The cusp tip is not as broad as the maxillary and lies lingual to the long axis of the tooth.",

      "CEJ curvature is greater on the mesial than on the mesial of the maxillary canine, and the developmental depression on the root is more pronounced than on the maxillary.",

  traps:[
    ["Cusp ridge lengths run opposite by arch","On the maxillary canine the mesial cusp ridge is shorter than the distal. On the mandibular canine the distal cusp ridge is longer than the mesial. Then wear reverses the maxillary relationship, making the mesial ridge longer."],
    ["Longer crown but shorter root on the mandibular","The mandibular canine has the longer crown at 11 mm versus 10 mm, while the maxillary canine has the longer root at 17 mm versus 16 mm. The maxillary canine root is the longest in the mouth."],
    ["Last succedaneous tooth to erupt","The maxillary canine calcifies early, at 4–5 months, but does not erupt until 11–12 years — after both maxillary premolars. The mandibular canine erupts much earlier, at 9–10 years, before its premolars."],
    ["Cusp tip position","Maxillary: cusp tip slightly mesial and labial of center, and slightly facial to the faciolingual bisecting line. Mandibular: cusp tip lingual to the long axis of the tooth."],
    ["Mesial contact sits higher than distal","On the maxillary canine the mesial height of contour is at the junction of the incisal and middle thirds while the distal is in the middle third — the mesial contact is more incisal. The mandibular canine follows the same pattern with mesial in the incisal third."],
    ["Distal is the deeper side on both","On both canines the distal shows less CEJ curvature, a more irregular or concave cervical outline, and deeper root fluting than the mesial."]
  ],
  questions:[
    {q:"The maxillary canine erupts at approximately:",o:["9–10 years","10–11 years","11–12 years","13–15 years"],a:2,e:"11–12 years, with root completion at 13–15 years. 13–15 years is the root completion age, not eruption."},
    {q:"Which tooth is usually the last succedaneous tooth to erupt?",o:["Mandibular second premolar","Maxillary canine","Maxillary second molar","Mandibular canine"],a:1,e:"The maxillary canine. Note that second molars and third molars erupt later but are not succedaneous, since they replace no deciduous tooth."},
    {q:"What is the average root length of a maxillary canine?",o:["14 mm","16 mm","17 mm","13 mm"],a:2,e:"17 mm — the longest root in the mouth. The mandibular canine root averages 16 mm."},
    {q:"Comparing crown lengths, the mandibular canine versus the maxillary canine:",o:["Maxillary is longer at 11 mm","Mandibular is longer at 11 mm","They are equal at 10 mm","Mandibular is shorter at 9 mm"],a:1,e:"The mandibular canine crown averages 11 mm and the maxillary 10 mm — but the maxillary has the longer root."},
    {q:"On the maxillary canine, the lobes rank in size as:",o:["Mesial > middle > distal","Middle > distal > mesial","Distal > middle > mesial","Middle > mesial > distal"],a:1,e:"The middle lobe is largest, followed by the distal, with the mesial smallest. The prominent middle lobe is what produces the canine eminence."},
    {q:"On a newly erupted maxillary canine, the mesial cusp ridge is:",o:["Longer than the distal cusp ridge","Shorter than the distal cusp ridge","Equal to the distal cusp ridge","Absent until wear occurs"],a:1,e:"Shorter than the distal at eruption. Functional wear then makes the mesial cusp ridge become longer than the distal over time."},
    {q:"On the mandibular canine, which cusp ridge is longer?",o:["Mesial","Distal","They are equal","It varies with the individual"],a:1,e:"The distal cusp ridge is longer than the mesial on the mandibular canine."},
    {q:"The cusp ridges of a maxillary canine make up approximately what portion of the crown?",o:["The incisal one third","The incisal one half","One quarter to one fifth","The middle third"],a:0,e:"On the maxillary canine the cusp ridges make up the incisal one third. On the mandibular canine the cusp tip and ridges make up one quarter to one fifth of crown length."},
    {q:"From the facial view of a maxillary canine, the distal outline is:",o:["Convex from CEJ to the contact area","Concave between the CEJ and the contact area in the middle third","Straight from CEJ to cusp tip","Convex only in the cervical third"],a:1,e:"The distal outline is concave between the CEJ and the contact area, which sits in the middle third. The mesial outline by contrast is convex from CEJ to its contact at the junction of the middle and incisal third."},
    {q:"On the maxillary canine, the mesial height of contour is located at:",o:["The cervical third","The middle third","The junction of the incisal and middle thirds","The cusp tip"],a:2,e:"Mesial at the junction of the incisal and middle thirds, distal in the middle third — so the mesial contact sits more incisally than the distal."},
    {q:"Which structure separates the mesial and distal fossae on the lingual of a maxillary canine?",o:["The cingulum","The lingual ridge","The marginal ridges","The transverse ridge"],a:1,e:"A prominent lingual ridge runs from the cingulum to the cusp tip, separating the mesial and distal fossae."},
    {q:"On the lingual of the maxillary canine, the more pronounced CEJ curve is found on which side?",o:["Mesial","Distal","They are equal","Neither — the CEJ is straight lingually"],a:1,e:"The lecture flags a more pronounced curve at the CEJ area on the distal, with the height of contour closer to the CEJ on the distal."},
    {q:"From the mesial view of a maxillary canine, the apex and cusp tip lie:",o:["Directly on the faciolingual bisecting line","Slightly facial to a line bisecting the tooth faciolingually","Slightly lingual to the bisecting line","Facial to the entire crown outline"],a:1,e:"Slightly facial to the bisecting line, with a shallow developmental depression running along the root length."},

  scope:null, examLen:null, examMode:'random' };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEYS = ['A','B','C','D','E'];

/* ============ tooth data ============ */
const PERM_NAMES = ['central incisor','lateral incisor','canine','first premolar','second premolar','first molar','second molar','third molar'];
const PRIM_NAMES = ['central incisor','lateral incisor','canine','first molar','second molar'];
const PERM_W = [24,21,23,25,25,33,31,29];
const PRIM_W = [21,19,22,28,31];

function buildTeeth(kind){
  const perm = kind === 'perm';
  const names = perm ? PERM_NAMES : PRIM_NAMES;
  const widths = perm ? PERM_W : PRIM_W;
  const n = perm ? 8 : 5;
  const uniPerm = i => String(i);
  const uniPrim = i => 'ABCDEFGHIJKLMNOPQRST'[i-1] || '';
  const arch = (fdiQuadA, fdiQuadB, uniStart, uniFn, upper) => {
    const out = [];
    for (let i = n; i >= 1; i--) out.push({ q:fdiQuadA, t:i });      // patient's right, posterior → anterior
    for (let i = 1; i <= n; i++) out.push({ q:fdiQuadB, t:i });      // patient's left, anterior → posterior
    return out.map((o, idx) => ({
      fdi: '' + o.q + o.t,
      uni: uniFn(uniStart + idx),
      palmer: perm ? String(o.t) : 'ABCDE'[o.t-1],
      pq: ({1:'q1',2:'q2',3:'q3',4:'q4',5:'q1',6:'q2',7:'q3',8:'q4'})[o.q],
      name: (perm ? 'permanent ' : 'primary ') +
            (upper ? 'maxillary ' : 'mandibular ') +
            (['q1','q4'].includes(({1:'q1',2:'q2',3:'q3',4:'q4',5:'q1',6:'q2',7:'q3',8:'q4'})[o.q]) ? 'right ' : 'left ') +
            names[o.t-1],
      w: widths[o.t-1], slot: idx, upper
    }));
  };
  if (perm) return [ ...arch(1,2,1,uniPerm,true), ...arch(4,3,25,i=>String(i<=32?i:i),false).map(x=>x) ];
  return [ ...arch(5,6,1,uniPrim,true), ...arch(8,7,16,uniPrim,false) ];
}
/* lower permanent arch runs 32..25 left-to-right on screen, so relabel */
function permTeeth(){
  const t = buildTeeth('perm');
  const lower = t.filter(x => !x.upper);
  lower.forEach((x, i) => { x.uni = String(32 - i); });
  return t;
}
function primTeeth(){
  const t = buildTeeth('prim');
  const lower = t.filter(x => !x.upper);
  lower.forEach((x, i) => { x.uni = 'ABCDEFGHIJKLMNOPQRST'[19 - i]; });
  return t;
}
const TEETH = { perm: permTeeth(), prim: primTeeth() };

/* ============ scoring ============ */
function unitStats(u){
  const a = state.answers[u.id] || {};
  const done = Object.keys(a).length;
  const right = Object.values(a).filter(v => v.ok).length;
  return { done, right, total: u.questions.length };
}
function overall(){
  let d = 0, r = 0, t = 0;
  UNITS.forEach(u => { const s = unitStats(u); d += s.done; r += s.right; t += s.total; });
  return { d, r, t };
}

/* ============ rail ============ */
function renderRail(){
  const o = overall();
  $('#overall').innerHTML = o.d ? `<b>${o.r}</b>/${o.d} correct · ${o.t} questions total` : `${o.t} practice questions`;
  $('#rail').innerHTML =
    `<div class="rail-label">Lectures</div>` +
    UNITS.map(u => {
      const s = unitStats(u);
      const chip = s.done ? `${s.right}/${s.done}` : `${s.total} q`;
      return `<button class="rail-item ${state.unit===u.id&&!state.searching?'on':''}" data-u="${u.id}">
        <span class="rail-code">${u.code}</span>
        <span class="rail-name">${esc(u.short)}</span>
        <span class="rail-score ${s.done===s.total?'done':''}">${chip}</span>
      </button>`;
    }).join('') +
    `<hr><button class="rail-item ${state.unit==='exam'&&!state.searching?'on':''}" data-u="exam">
      <span class="rail-code">★</span><span class="rail-name">Mixed exam review</span><span class="rail-score"></span>
    </button>`;
  $('#rail').querySelectorAll('[data-u]').forEach(b => b.onclick = () => {
    state.unit = b.dataset.u; state.view = 'notes'; state.searching = false;
    $('#search').value = ''; render(); window.scrollTo({ top: 0 });
  });
}

function qHTML(q, key, idx, store, tag){
  const rec = store[key];
  const done = !!rec;
  const opts = q.o.map((o, i) => {
    let cls = 'opt';
    if (done) {
      if (i === q.a) cls += ' correct';
      else if (i === rec.pick) cls += ' chosen-wrong';
    }
    return `<button class="${cls}" ${done?'disabled':''} data-k="${key}" data-i="${i}">
      <span class="k">${KEYS[i]}</span><span>${esc(o)}</span></button>`;
  }).join('');
  const expl = done
    ? `<div class="expl ${rec.ok?'ok':'no'}"><span class="verdict">${rec.ok?'Correct':'Not quite — the answer is '+KEYS[q.a]}</span>${esc(q.e)}</div>`
    : '';
  return `<article class="q"><span class="qnum">Q${String(idx+1).padStart(2,'0')}</span>${tag?`<span class="qtag">${esc(tag)}</span>`:''}
    <p class="stem">${esc(q.q)}</p><div class="opts">${opts}</div>${expl}</article>`;
}
function renderPractice(u){
  const s = unitStats(u);
  const pct = s.done ? Math.round(s.right / s.done * 100) : 0;
  const bar = `<div class="qbar">
      <span class="stat"><b>${s.done}</b>/${s.total} answered</span>
      <span class="stat"><b>${s.right}</b> correct${s.done?` · ${pct}%`:''}</span>
      <span class="meter"><i style="width:${s.total?s.done/s.total*100:0}%"></i></span>
      <button class="btn" data-act="reset">Reset this set</button>
    </div>`;
  return bar + u.questions.map((q, i) => qHTML(q, u.id + ':' + i, i, state.answers[u.id] || {})).join('');
}

/* ============ exam ============ */
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function entryFor(key){
  const [uid, i] = key.split(':');
  const u = UNITS.find(x => x.id === uid);
  if (!u || !u.questions[+i]) return null;
  return { q: u.questions[+i], tag: u.short, key };
}
function inScope(uid){ return !state.scope || state.scope.has(uid); }
function buildExam(n){
  const pool = [];
  UNITS.forEach(u => { if (inScope(u.id)) u.questions.forEach((q, i) => pool.push({ q, tag: u.short, key: u.id + ':' + i })); });
  shuffle(pool);
  state.exam = pool.slice(0, Math.min(n, pool.length));
  state.examAns = {};
  state.examLen = n;
  state.examMode = 'random';
}
function missedKeys(){
  const keys = new Set();
  Object.entries(state.answers).forEach(([uid, rec]) => {
    Object.entries(rec).forEach(([k, v]) => { if (!v.ok && inScope(uid)) keys.add(k); });
  });
  Object.entries(state.examAns).forEach(([k, v]) => { if (!v.ok && inScope(k.split(':')[0])) keys.add(k); });
  return [...keys];
}
function buildMissSet(){
  const entries = missedKeys().map(entryFor).filter(Boolean);
  shuffle(entries);
  state.exam = entries;
  state.examAns = {};
  state.examLen = null;
  state.examMode = 'misses';
}
function renderExam(){
  const inPool = UNITS.filter(u => inScope(u.id)).reduce((a, u) => a + u.questions.length, 0);
  const misses = missedKeys().length;
  const scopeChips = UNITS.map(u =>
    `<button class="btn chip ${inScope(u.id)?'solid':''}" data-scope="${u.id}">${u.code} ${esc(u.short)}</button>`).join('');
  const builder = `<div class="builder">
      <h2>Build a set</h2>
      <p>Draws at random from the lectures you select and labels every question with its source, so you can see which unit is costing you points. Answer, then check the breakdown at the bottom to decide what to review.</p>
      <div class="sublabel">Length</div>
      <div class="chips">
        <button class="btn ${state.examMode==='random'&&state.examLen===20?'solid':''}" data-n="20">20 questions</button>
        <button class="btn ${state.examMode==='random'&&state.examLen===40?'solid':''}" data-n="40">40 questions</button>
        <button class="btn ${state.examMode==='random'&&state.examLen===75?'solid':''}" data-n="75">75 questions</button>
        <button class="btn ${state.examMode==='random'&&state.examLen===9999?'solid':''}" data-n="9999">All ${inPool}</button>
        <button class="btn ${state.examMode==='misses'?'solid':''}" data-miss="1" ${misses?'':'disabled style="opacity:.45"'}>Retry my misses (${misses})</button>
      </div>
      <div class="sublabel">Lectures in the draw</div>
      <div class="chips">
        <button class="btn" data-scope="__all">${state.scope?'Select all':'All selected'}</button>
        ${scopeChips}
      </div>
    </div>`;
  if (!state.exam) return builder + `<p class="empty">Pick a length to build your set.</p>`;
  if (!state.exam.length) return builder + `<p class="empty">${state.examMode==='misses'?'No missed questions yet in the selected lectures — answer some first.':'No questions in the selected lectures.'}</p>`;
  const done = Object.keys(state.examAns).length;
  const right = Object.values(state.examAns).filter(v => v.ok).length;
  const bar = `<div class="qbar">
      <span class="stat"><b>${done}</b>/${state.exam.length} answered</span>
      <span class="stat"><b>${right}</b> correct${done?` · ${Math.round(right/done*100)}%`:''}</span>
      <span class="meter"><i style="width:${done/state.exam.length*100}%"></i></span>
      ${state.examMode==='misses'?`<span class="stat" style="color:var(--gold)">Misses only</span>`:''}
    </div>`;
  return builder + bar + state.exam.map((e, i) => qHTML(e.q, e.key, i, state.examAns, e.tag)).join('') + examBreakdown();
}
function examBreakdown(){
  const done = Object.keys(state.examAns).length;
  if (!done) return '';
  const byUnit = {};
  Object.entries(state.examAns).forEach(([k, v]) => {
    const uid = k.split(':')[0];
    byUnit[uid] = byUnit[uid] || { d: 0, r: 0 };
    byUnit[uid].d++; if (v.ok) byUnit[uid].r++;
  });
  const rows = Object.entries(byUnit).map(([uid, v]) => {
    const u = UNITS.find(x => x.id === uid) || { short: uid, code: '' };
    return { u, ...v, pct: v.r / v.d };
  }).sort((a, b) => a.pct - b.pct || b.d - a.d);
  const total = Object.values(state.examAns).filter(v => v.ok).length;
  return `<section class="sec"><h2>Breakdown by lecture</h2>
    <div class="tblwrap"><table><thead><tr><th>Lecture</th><th>Correct</th><th>Score</th><th>Read next</th></tr></thead><tbody>` +
    rows.map(r => {
      const p = Math.round(r.pct * 100);
      const verdict = r.d < 3 ? 'Too few to judge' : p >= 85 ? 'Solid' : p >= 70 ? 'Shaky — skim the traps' : 'Go back to the notes';
      return `<tr><td>${r.u.code} ${esc(r.u.short)}</td><td>${r.r}/${r.d}</td>
        <td><span class="scorebar"><i style="width:${p}%;background:${p>=85?'var(--right)':p>=70?'var(--gold)':'var(--wrong)'}"></i></span> ${p}%</td>
        <td>${verdict}</td></tr>`;
    }).join('') +
    `</tbody></table></div>
    <p class="totalline">Overall this set: <b>${total}/${done}</b> · ${Math.round(total/done*100)}%</p></section>`;
}

/* ============ odontogram ============ */
let chartKind = 'perm', chartSel = null, chartLabels = true, drillTarget = null;
function toothLayout(list){
  const big = list.length > 20;
  const cx = 410, cyU = 200, cyL = 322;
  const rx = big ? 348 : 300, ry = big ? 155 : 138;
  const N = list.length / 2;
  const a0 = big ? 191 : 177, a1 = big ? -11 : 3;
  return list.map((t, i) => {
    const k = t.slot;
    const deg = a0 + (a1 - a0) * (k / (N - 1));
    const rad = deg * Math.PI / 180;
    const x = cx + rx * Math.cos(rad);
    const y = t.upper ? cyU - ry * Math.sin(rad) : cyL + ry * Math.sin(rad);
    const rot = t.upper ? 90 - deg : deg - 90;
    return { ...t, x, y, rot };
  });
}
function odontogramHTML(){
  const list = toothLayout(TEETH[chartKind]);
  const h = chartKind === 'perm' ? 36 : 32;
  const teeth = list.map(t => `<g class="tooth" data-fdi="${t.fdi}" transform="translate(${t.x.toFixed(1)} ${t.y.toFixed(1)}) rotate(${t.rot.toFixed(1)})">
      <rect x="${-t.w/2}" y="${-h/2}" width="${t.w}" height="${h}" rx="5"/>
      ${chartLabels?`<text x="0" y="0" transform="rotate(${(-t.rot).toFixed(1)})">${t.uni}</text>`:''}
    </g>`).join('');
  return `<div class="chart">
    <div class="chart-top">
      <span class="chart-title">Interactive tooth chart</span>
      <button class="btn ${chartKind==='perm'?'solid':''}" data-chart="perm">Permanent</button>
      <button class="btn ${chartKind==='prim'?'solid':''}" data-chart="prim">Primary</button>
      <button class="btn ${chartLabels?'':'solid'}" data-chart="labels">${chartLabels?'Hide numbers':'Show numbers'}</button>
      <button class="btn" data-chart="drill">Quiz me</button>
    </div>
    <div class="drill ${drillTarget?'on':''}" id="drill"></div>
    <svg viewBox="0 0 820 520" role="img" aria-label="Interactive dental arch chart">
      <line class="midline" x1="410" y1="30" x2="410" y2="490"/>
      <text class="archlabel" x="24" y="264">PATIENT RIGHT</text>
      <text class="archlabel" x="796" y="264" text-anchor="end">PATIENT LEFT</text>
      ${teeth}
    </svg>
    <div class="readout" id="readout"></div>
  </div>`;
}
function readoutHTML(){
  if (!chartSel) return `<div class="cell" style="grid-column:1/-1"><span class="lab">Tooth</span><span class="val name" style="color:var(--muted);font-weight:400">Select any tooth to see it in all three systems.</span></div>`;
  const t = TEETH[chartKind].find(x => x.fdi === chartSel);
  const nm = t.name.charAt(0).toUpperCase() + t.name.slice(1);
  return `
    <div class="cell" style="grid-column:span 2"><span class="lab">Tooth</span><span class="val name">${esc(nm)}</span></div>
    <div class="cell"><span class="lab">Universal</span><span class="val">${t.uni}</span></div>
    <div class="cell"><span class="lab">Palmer</span><span class="val"><span class="palmer ${t.pq}">${t.palmer}</span></span></div>
    <div class="cell"><span class="lab">FDI</span><span class="val">${t.fdi}</span></div>`;
}
function wireChart(){
  const readout = $('#readout'); if (!readout) return;
  readout.innerHTML = readoutHTML();
  document.querySelectorAll('.chart [data-chart]').forEach(b => b.onclick = () => {
    const v = b.dataset.chart;
    if (v === 'labels') chartLabels = !chartLabels;
    else if (v === 'drill') startDrill();
    else { chartKind = v; chartSel = null; drillTarget = null; }
    render();
  });
  document.querySelectorAll('.tooth').forEach(g => g.onclick = () => {
    const fdi = g.dataset.fdi;
    if (drillTarget) {
      const hit = fdi === drillTarget;
      document.querySelectorAll('.tooth').forEach(x => x.classList.remove('hit', 'miss', 'sel'));
      g.classList.add(hit ? 'hit' : 'miss');
      if (!hit) { const right = document.querySelector(`.tooth[data-fdi="${drillTarget}"]`); if (right) right.classList.add('hit'); }
      const t = TEETH[chartKind].find(x => x.fdi === drillTarget);
      $('#drill').innerHTML = hit
        ? `<b>Correct.</b> That is Universal ${t.uni} · FDI ${t.fdi}. <button class="btn" id="nextdrill">Next tooth</button>`
        : `<b>Not that one.</b> The answer is highlighted: Universal ${t.uni} · FDI ${t.fdi}. <button class="btn" id="nextdrill">Next tooth</button>`;
      $('#nextdrill').onclick = () => { startDrill(); render(); };
      drillTarget = null;
      chartSel = fdi;
      readout.innerHTML = readoutHTML();
      return;
    }
    chartSel = fdi;
    document.querySelectorAll('.tooth').forEach(x => x.classList.remove('sel'));
    g.classList.add('sel');
    readout.innerHTML = readoutHTML();
  });
  if (drillTarget) {
    const t = TEETH[chartKind].find(x => x.fdi === drillTarget);
    $('#drill').innerHTML = `Find the <b>${esc(t.name)}</b> — click it on the chart.`;
  }
  if (chartSel && !drillTarget) {
    const g = document.querySelector(`.tooth[data-fdi="${chartSel}"]`); if (g) g.classList.add('sel');
  }
}
function startDrill(){
  const pool = TEETH[chartKind];
  drillTarget = pool[Math.floor(Math.random() * pool.length)].fdi;
  chartSel = null;
}

/* ============ search ============ */
function buildIndex(){
  const idx = [];
  UNITS.forEach(u => u.sections.forEach(sec => {
    if (sec.defs) sec.defs.forEach(([t, d]) => idx.push({ u, sec: sec.h, t, x: d }));
    if (sec.rules) sec.rules.forEach(r => idx.push({ u, sec: sec.h, t: sec.h, x: r }));
    if (sec.callout) idx.push({ u, sec: sec.h, t: sec.h, x: sec.callout });
    if (sec.table) sec.table.rows.forEach(r => idx.push({ u, sec: sec.h, t: r[0], x: r.slice(1).join(' — ') }));
  }));
  UNITS.forEach(u => (u.traps || []).forEach(([t, x]) => idx.push({ u, sec: 'Watch out', t, x })));
  return idx;
}
const INDEX = buildIndex();
function hl(s, q){
  const i = s.toLowerCase().indexOf(q);
  if (i < 0) return esc(s);
  return esc(s.slice(0, i)) + '<mark>' + esc(s.slice(i, i + q.length)) + '</mark>' + esc(s.slice(i + q.length));
}
function renderSearch(q){
  const hits = INDEX.filter(e => (e.t + ' ' + e.x).toLowerCase().includes(q)).slice(0, 60);
  if (!hits.length) return `<div class="results"><p class="empty">Nothing matches “${esc(q)}”. Try a shorter term.</p></div>`;
  return `<div class="results"><div class="rescount">${hits.length} match${hits.length===1?'':'es'}</div>` +
    hits.map(e => `<button class="res" data-go="${e.u.id}">
      <span class="where">${esc(e.u.short)} · ${esc(e.sec)}</span>
      <span class="t">${hl(e.t, q)}</span><p class="x">${hl(e.x, q)}</p></button>`).join('') + `</div>`;
}

/* ============ render ============ */
function render(){
  renderRail();
  const stage = $('#stage');
  const q = $('#search').value.trim().toLowerCase();
  if (state.searching && q.length >= 2){
    stage.innerHTML = renderSearch(q);
    stage.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
      state.unit = b.dataset.go; state.view = 'notes'; state.searching = false;
      $('#search').value = ''; render(); window.scrollTo({ top: 0 });
    });
    return;
  }
  if (state.unit === 'exam'){
    stage.innerHTML = `<div class="uhead"><span class="code">★ REVIEW</span><h1>Mixed exam review</h1>
      <span class="src">All lectures · ${UNITS.reduce((a,u)=>a+u.questions.length,0)} questions in the pool</span></div>` + renderExam();
    stage.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { buildExam(+b.dataset.n); render(); window.scrollTo({top:0}); });
    const mb = stage.querySelector('[data-miss]');
    if (mb && !mb.disabled) mb.onclick = () => { buildMissSet(); render(); window.scrollTo({top:0}); };
    stage.querySelectorAll('[data-scope]').forEach(b => b.onclick = () => {
      const v = b.dataset.scope;
      if (v === '__all') state.scope = null;
      else {
        if (!state.scope) state.scope = new Set(UNITS.map(u => u.id));
        if (state.scope.has(v)) state.scope.delete(v); else state.scope.add(v);
        if (state.scope.size === UNITS.length) state.scope = null;
        if (state.scope && !state.scope.size) state.scope = new Set([v]);
      }
      if (state.exam) { if (state.examMode === 'misses') buildMissSet(); else buildExam(state.examLen || 20); }
      render();
    });
    wireAnswers(stage, state.examAns);
    return;
  }
  const u = UNITS.find(x => x.id === state.unit);
  const s = unitStats(u);
  stage.innerHTML = `<div class="uhead">
      <span class="code">LECTURE ${u.code}</span>
      <h1>${esc(u.title)}</h1>
      <span class="src">${esc(u.source)}</span>
      <p class="blurb">${esc(u.blurb)}</p>
    </div>
    <div class="segs">
      <button class="seg ${state.view==='notes'?'on':''}" data-v="notes">Study notes</button>
      <button class="seg ${state.view==='traps'?'on':''}" data-v="traps">Watch out<span class="n">${(u.traps||[]).length}</span></button>
      <button class="seg ${state.view==='practice'?'on':''}" data-v="practice">Practice<span class="n">${s.done}/${s.total}</span></button>
    </div>
    <div id="body"></div>`;
  const body = $('#body');
  if (state.view === 'notes') body.innerHTML = renderNotes(u);
  else if (state.view === 'traps') body.innerHTML = renderTraps(u);
  else body.innerHTML = renderPractice(u);

  stage.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { state.view = b.dataset.v; render(); });
  if (state.view === 'notes' && u.odontogram) wireChart();
  if (state.view === 'practice'){
    state.answers[u.id] = state.answers[u.id] || {};
    wireAnswers(stage, state.answers[u.id]);
    const r = stage.querySelector('[data-act="reset"]');
    if (r) r.onclick = () => { state.answers[u.id] = {}; render(); };
  }
}
function wireAnswers(scope, store){
  scope.querySelectorAll('.opt:not(:disabled)').forEach(b => b.onclick = () => {
    const key = b.dataset.k, pick = +b.dataset.i;
    let q;
    if (store === state.examAns) q = (state.exam.find(e => e.key === key) || {}).q;
    else { const [uid, i] = key.split(':'); q = UNITS.find(u => u.id === uid).questions[+i]; }
    if (!q) return;
    store[key] = { pick, ok: pick === q.a };
    const y = window.scrollY;
    render();
    window.scrollTo({ top: y });
  });
}

/* ============ boot ============ */
$('#search').addEventListener('input', () => {
  const v = $('#search').value.trim();
  state.searching = v.length >= 2;
  render();
});
$('#search').addEventListener('keydown', e => {
  if (e.key === 'Escape'){ $('#search').value = ''; state.searching = false; render(); }
});
render();
</script>
</body>
</html>
