<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morphology &amp; Occlusion — Study Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#132029;
  --ink-2:#3a4c59;
  --muted:#6d7f8c;
  --paper:#eef2f5;
  --card:#ffffff;
  --line:#d9e2e8;
  --line-soft:#e8eef2;
  --accent:#0f6157;
  --accent-2:#14806f;
  --accent-soft:#e2f0ec;
  --gold:#87610f;
  --gold-soft:#fbf1d9;
  --gold-line:#e8d5a4;
  --right:#186b3f;
  --right-soft:#e4f2e9;
  --wrong:#a8332a;
  --wrong-soft:#fae9e7;
  --ui:'Archivo',system-ui,-apple-system,sans-serif;
  --body:'Source Serif 4',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent-2);outline-offset:2px;border-radius:4px}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--ink);color:#eef2f5;
  display:flex;align-items:center;gap:20px;
  padding:12px 22px;
  border-bottom:1px solid #0b141b;
}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand .eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:#7fada4;
}
.brand .name{font-family:var(--ui);font-weight:600;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.searchwrap{margin-left:auto;position:relative;flex:0 1 340px}
#search{
  width:100%;padding:8px 12px 8px 32px;
  background:#1e2f3a;border:1px solid #2c4250;
  border-radius:7px;color:#eef2f5;font-family:var(--ui);font-size:13.5px;
}
#search::placeholder{color:#7b929e}
#search:focus{outline:none;border-color:var(--accent-2);background:#223642}
.searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.55}
.overall{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:#9db9b3;
  white-space:nowrap;
}
.overall b{color:#fff;font-weight:500}

/* ---------- layout ---------- */
.layout{display:flex;align-items:flex-start;max-width:1500px;margin:0 auto}
.rail{
  position:sticky;top:57px;flex:0 0 250px;
  height:calc(100vh - 57px);overflow-y:auto;
  padding:20px 12px 40px 18px;
}
.rail-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);padding:0 8px 8px;
}
.rail-item{
  display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:9px;
  width:100%;text-align:left;background:none;border:0;
  padding:9px 9px;margin-bottom:2px;border-radius:8px;color:var(--ink-2);
}
.rail-item:hover{background:#e3eaef}
.rail-item.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(19,32,41,.09)}
.rail-item.on .rail-code{color:var(--accent)}
.rail-code{font-family:var(--mono);font-size:11px;color:var(--muted)}
.rail-name{font-family:var(--ui);font-size:13.5px;font-weight:500;line-height:1.25}
.rail-score{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.rail-score.done{color:var(--accent)}
.rail hr{border:0;border-top:1px solid var(--line);margin:14px 8px}

.stage{flex:1 1 auto;min-width:0;padding:26px 34px 90px;max-width:1000px}

/* ---------- unit head ---------- */
.uhead{margin-bottom:20px}
.uhead .code{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--accent);
  display:block;margin-bottom:6px;
}
.uhead h1{
  font-family:var(--ui);font-weight:600;font-size:clamp(25px,3.4vw,34px);
  letter-spacing:-.022em;margin:0 0 8px;line-height:1.1;
}
.uhead .src{font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.uhead .blurb{margin:10px 0 0;max-width:70ch;color:var(--ink-2);font-size:16.5px}

.segs{display:flex;gap:4px;margin:22px 0 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{
  background:none;border:0;border-bottom:2px solid transparent;
  padding:8px 13px;margin-bottom:-1px;
  font-family:var(--ui);font-size:13.5px;font-weight:500;color:var(--muted);
}
.seg:hover{color:var(--ink)}
.seg.on{color:var(--ink);border-bottom-color:var(--accent)}
.seg .n{font-family:var(--mono);font-size:10.5px;opacity:.7;margin-left:5px}

/* ---------- notes ---------- */
.sec{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:20px 24px;margin-bottom:14px;
}
.sec > h2{
  font-family:var(--ui);font-weight:600;font-size:14px;letter-spacing:.01em;
  margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line-soft);
  text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-size:11.5px;
}
dl.defs{margin:0}
dl.defs > div{padding:9px 0;border-bottom:1px dotted var(--line);display:grid;grid-template-columns:200px 1fr;gap:18px}
dl.defs > div:last-child{border-bottom:0;padding-bottom:0}
dl.defs > div:first-child{padding-top:0}
dl.defs dt{font-family:var(--ui);font-weight:600;font-size:14px;color:var(--ink)}
dl.defs dd{margin:0;color:var(--ink-2)}
ul.rules{margin:0;padding:0;list-style:none}
ul.rules li{
  position:relative;padding:5px 0 5px 20px;color:var(--ink-2);
}
ul.rules li::before{
  content:"";position:absolute;left:3px;top:15px;
  width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.5;
}
.callout{
  background:var(--accent-soft);border-left:3px solid var(--accent);
  padding:11px 15px;border-radius:0 7px 7px 0;margin:0 0 14px;
  color:#0d4c44;font-size:15.5px;
}
.sec .callout:last-child{margin-bottom:0}
.tblwrap{overflow-x:auto;margin:0 0 14px}
.sec .tblwrap:last-child{margin-bottom:0}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
th{
  font-family:var(--ui);font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--line);
  white-space:nowrap;
}
tbody tr:last-child td{border-bottom:0}
td:first-child{font-family:var(--ui);font-weight:500;font-size:14px}
tbody tr:hover{background:#f7fafb}

/* ---------- traps ---------- */
.trap{
  background:var(--gold-soft);border:1px solid var(--gold-line);
  border-radius:var(--r);padding:15px 18px;margin-bottom:11px;
}
.trap h3{
  font-family:var(--ui);font-size:14.5px;font-weight:600;margin:0 0 5px;color:#5d420a;
  display:flex;align-items:baseline;gap:8px;
}
.trap h3::before{
  content:"!";font-family:var(--mono);font-size:11px;font-weight:600;
  background:var(--gold);color:#fff;width:16px;height:16px;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;flex:0 0 16px;
  transform:translateY(-1px);
}
.trap p{margin:0;color:#6b4f18;font-size:15.5px}

/* ---------- questions ---------- */
.qbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 18px;margin-bottom:16px;position:sticky;top:57px;z-index:20;
}
.qbar .stat{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.qbar .stat b{font-weight:600;color:var(--ink)}
.meter{flex:1 1 120px;height:5px;background:var(--line-soft);border-radius:99px;overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
.btn{
  font-family:var(--ui);font-size:12.5px;font-weight:500;
  background:var(--card);border:1px solid var(--line);color:var(--ink-2);
  padding:6px 12px;border-radius:7px;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.solid:hover{background:var(--accent-2);border-color:var(--accent-2);color:#fff}

.q{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 22px;margin-bottom:12px;
}
.q .qnum{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.1em}
.q .qtag{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin-left:8px}
.q .stem{margin:6px 0 14px;font-size:16.5px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:#fbfcfd;border:1px solid var(--line);border-radius:8px;
  padding:10px 13px;font-family:var(--body);font-size:15.5px;color:var(--ink-2);
  transition:border-color .12s,background .12s;
}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt .k{
  font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;
  width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;
  flex:0 0 20px;margin-top:2px;background:#fff;
}
.opt.correct{background:var(--right-soft);border-color:var(--right);color:#124c2d}
.opt.correct .k{background:var(--right);border-color:var(--right);color:#fff}
.opt.chosen-wrong{background:var(--wrong-soft);border-color:var(--wrong);color:#7d251e}
.opt.chosen-wrong .k{background:var(--wrong);border-color:var(--wrong);color:#fff}
.expl{
  margin-top:13px;padding:12px 15px;border-radius:8px;
  background:#f4f7f9;border-left:3px solid var(--accent);
  font-size:15.5px;color:var(--ink-2);
}
.expl .verdict{font-family:var(--ui);font-weight:600;font-size:13px;display:block;margin-bottom:3px}
.expl.ok .verdict{color:var(--right)}
.expl.no .verdict{color:var(--wrong)}
.expl.no{border-left-color:var(--wrong);background:#fdf6f5}

/* ---------- odontogram ---------- */
.chart{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px 20px;margin-bottom:14px;
}
.chart-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.chart-title{
  font-family:var(--ui);font-size:11.5px;font-weight:600;text-transform:uppercase;
  letter-spacing:.07em;color:var(--accent);margin-right:auto;
}
.chart svg{width:100%;height:auto;display:block;touch-action:manipulation}
.tooth rect{fill:#f3f7f8;stroke:#c3d2d9;stroke-width:1.4;transition:fill .12s,stroke .12s}
.tooth text{font-family:'IBM Plex Mono',monospace;font-size:11px;fill:#55676f;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tooth{cursor:pointer}
.tooth:hover rect{fill:var(--accent-soft);stroke:var(--accent)}
.tooth.sel rect{fill:var(--accent);stroke:var(--accent)}
.tooth.sel text{fill:#fff}
.tooth.hit rect{fill:var(--right);stroke:var(--right)}
.tooth.hit text{fill:#fff}
.tooth.miss rect{fill:var(--wrong-soft);stroke:var(--wrong)}
.midline{stroke:var(--line);stroke-width:1;stroke-dasharray:4 5}
.archlabel{font-family:'IBM Plex Mono',monospace;font-size:10px;fill:#93a5ad;letter-spacing:.12em}
.readout{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;
  margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft);
}
.readout .cell{min-width:0}
.readout .lab{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);display:block;margin-bottom:3px;
}
.readout .val{font-family:var(--ui);font-size:17px;font-weight:600;letter-spacing:-.01em}
.readout .val.name{font-size:14.5px;font-weight:500;line-height:1.3}
.palmer{
  display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:16px;font-weight:500;
  min-width:26px;height:26px;padding:0 5px;
}
.palmer.q1{border-right:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.palmer.q2{border-left:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.palmer.q3{border-left:2px solid var(--ink);border-top:2px solid var(--ink)}
.palmer.q4{border-right:2px solid var(--ink);border-top:2px solid var(--ink)}
.drill{
  margin-top:12px;padding:11px 15px;border-radius:8px;background:var(--accent-soft);
  font-size:15.5px;color:#0d4c44;display:none;
}
.drill.on{display:block}
.drill b{font-family:var(--ui);font-weight:600}

/* ---------- search results ---------- */
.results{max-width:900px}
.rescount{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:14px;letter-spacing:.05em}
.res{
  background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:13px 17px;margin-bottom:8px;width:100%;text-align:left;display:block;
}
.res:hover{border-color:var(--accent)}
.res .where{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.res .t{font-family:var(--ui);font-weight:600;font-size:14.5px;margin-bottom:2px}
.res .x{font-size:14.5px;color:var(--ink-2);margin:0}
mark{background:#fdf0c4;color:inherit;padding:0 1px;border-radius:2px}
.empty{color:var(--muted);font-family:var(--ui);font-size:14px;padding:20px 0}

/* ---------- exam builder ---------- */
.builder{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 24px;margin-bottom:16px;
}
.builder h2{font-family:var(--ui);font-size:15px;font-weight:600;margin:0 0 6px}
.builder p{margin:0 0 16px;color:var(--ink-2);max-width:62ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.builder .chips:last-child{margin-bottom:0}
.sublabel{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;
}
.btn.chip{font-size:11.5px;padding:5px 10px}
.btn.chip .rail-code{margin-right:4px}
.scorebar{
  display:inline-block;width:64px;height:5px;border-radius:99px;
  background:var(--line-soft);overflow:hidden;vertical-align:middle;margin-right:7px;
}
.scorebar i{display:block;height:100%}
.totalline{margin:14px 0 0;font-size:15px;color:var(--ink-2)}
.totalline b{font-family:var(--ui);font-weight:600;color:var(--ink)}

@media(max-width:900px){
  .layout{display:block}
  .rail{
    position:sticky;top:57px;height:auto;width:100%;flex:none;
    display:flex;gap:6px;overflow-x:auto;padding:10px 14px;
    background:var(--paper);border-bottom:1px solid var(--line);z-index:30;
  }
  .rail-label,.rail hr{display:none}
  .rail-item{width:auto;flex:0 0 auto;grid-template-columns:auto auto;gap:7px;padding:7px 12px;border:1px solid var(--line)}
  .rail-item .rail-score{display:none}
  .stage{padding:20px 16px 70px;max-width:none}
  .sec{padding:16px 16px}
  dl.defs > div{grid-template-columns:1fr;gap:2px}
  .qbar{position:static}
  .topbar{flex-wrap:wrap;gap:10px;padding:10px 14px}
  .searchwrap{flex:1 1 100%;margin-left:0;order:3}
  .overall{order:2;margin-left:auto}
  .q{padding:15px 16px}
}
@media print{
  .topbar,.rail,.segs,.qbar,.builder{display:none}
  body{background:#fff}
  .sec,.trap,.q{break-inside:avoid;border-color:#ccc}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="eyebrow">Morphology &amp; Occlusion</span>
    <span class="name">Dental Morphology Study Guide</span>
  </div>
  <div class="overall" id="overall"></div>
  <div class="searchwrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9db9b3" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search every lecture…" autocomplete="off">
  </div>
</header>

<div class="layout">
  <nav class="rail" id="rail"></nav>
  <main class="stage" id="stage"></main>
</div>

<script>
const UNITS = [
{
  id:"nomen", code:"01", title:"Dental Nomenclature & Structures",
  short:"Nomenclature",
  source:"Parts 1 & 2 of 2",
  blurb:"The vocabulary layer. Arches, dentition classes, tooth tissues, surfaces, line and point angles, and the division of crown and root into thirds.",
  sections:[
    {h:"Arches, midline, quadrants", defs:[
      ["Maxillary","Reference to teeth in the upper arch."],
      ["Mandibular","Reference to teeth in the lower arch."],
      ["Midline","The imaginary vertical line that divides each arch and the body into two equal halves (right and left)."],
      ["Mid-sagittal plane","The two-dimensional plane dividing the body into right and left halves."],
      ["Quadrants","The two approximately equal portions of each arch divided by the midline. There are 4 in the mouth: Q1 maxillary right, Q2 maxillary left, Q3 mandibular left, Q4 mandibular right."],
      ["Occlusion","The manner in which the mandibular teeth contact the maxillary teeth."],
      ["Mastication","The process of biting or chewing food."]
    ]},
    {h:"Classification of dentition", defs:[
      ["Heterodont","Dentition comprised of different types, or classes, of teeth performing different functions. Humans are heterodont."],
      ["Homodont","Dentition in which all teeth are the same in form and type. Found in lower vertebrates."],
      ["Diphyodont","Dentition having two separate sets of teeth. Humans are diphyodont — a deciduous (first/primary) dentition and a permanent (second/adult) dentition."],
      ["Monophyodont","Dentition in which there is only one set of teeth."],
      ["Polyphyodont","Dentition with more than two sets, or continuous sets developed throughout life."]
    ]},
    {h:"Classification of the teeth", table:{head:["Per quadrant","Deciduous","Permanent"],rows:[
      ["Incisors","2 — central and lateral","2 — central and lateral"],
      ["Canines","1 — also called cuspid","1 — also called cuspid"],
      ["Premolars","none","2 — bicuspids; first and second"],
      ["Molars","2 — first and second","3 — first, second, third"],
      ["Total per quadrant","5","8"]
    ]},
    rules:[
      "Anterior teeth — the teeth in either arch toward the front of the mouth. Includes incisors and canines in both dentitions.",
      "Posterior teeth — the teeth in either arch toward the back. In the deciduous dentition this is the two molars per quadrant; in the permanent dentition it is the premolars and molars."
    ]},
    {h:"Dentition periods", table:{head:["Period","Teeth present","Age"],rows:[
      ["Primary","Deciduous only","6 months – 6 years"],
      ["Mixed","Both deciduous and permanent","6 – 12 years"],
      ["Permanent","Permanent only","12 years – rest of life"]
    ]},
    defs:[
      ["Exfoliation","The shedding of primary dentition to allow eruption of the permanent tooth into the same area."],
      ["Resorption","The natural process by which deciduous roots are 'melted away' to allow for exfoliation."],
      ["Succedaneous","Permanent teeth that replace exfoliated deciduous teeth."]
    ]},
    {h:"Dental formula", rules:[
      "A number and letter designation of the various types of teeth found in a dentition.",
      "It indicates the dentition of only one side of the mouth.",
      "It must be multiplied by a factor of two to give the number of teeth in the entire dentition."
    ]},
    {h:"Crown and root", defs:[
      ["Anatomical crown","That portion of the tooth covered by enamel."],
      ["Clinical crown","That portion of the tooth visible in the mouth."],
      ["Anatomical root","That portion of the tooth covered with cementum."],
      ["Clinical root","That portion of the tooth not visible in the mouth."],
      ["Apex","The termination or tip of the root. Plural: apices."]
    ]},
    {h:"Dental tissues", defs:[
      ["Enamel","The hard, mineralized tissue covering the dentin of the anatomical crown."],
      ["Dentin","The hard tissue forming the main body of the tooth."],
      ["Cementum","The layer of hard, bonelike tissue covering the dentin of the anatomical root."],
      ["Cemento-enamel junction (CEJ)","The identifiable line around the external surface of a tooth where enamel and cementum meet. Separates the anatomical crown from the anatomical root. Also called the cervical line."],
      ["Dentino-enamel junction (DEJ)","The internal line of meeting of the dentin and enamel in the anatomical crown."],
      ["Pulp","The living soft tissue occupying the pulp cavity of a vital tooth. Contains the tooth's nutrient supply as blood vessels, and nerve supply."],
      ["Pulp cavity","The entire internal cavity containing the pulp. Consists of pulp canals, pulp chamber, and pulp horns."],
      ["Pulp canals","That portion of the pulp cavity located in the root(s). Also called root canals."],
      ["Pulp chamber","The enlarged portion of the pulp cavity, found mostly in the anatomical crown."],
      ["Pulp horns","The usually pointed incisal or occlusal elongations of the pulp chamber, often corresponding to the cusps or lobes."]
    ]},
    {h:"Supporting structures", defs:[
      ["Alveolar process","The entire bony entity that surrounds and supports all the teeth in each jaw."],
      ["Alveolus","The bony socket, or portion of the alveolar process, into which an individual tooth is set. Plural: alveoli."],
      ["Periodontal ligament","The fibrous attachment of the tooth cementum to the alveolar bone."],
      ["Gingiva","The fibrous tissue enclosed by mucous membrane that covers the alveolar processes and surrounds the necks of the teeth — the 'gums'. Plural: gingivae."]
    ]},
    {h:"Tooth surfaces", defs:[
      ["Mesial","The tooth surface toward the midline."],
      ["Distal","The tooth surface away from the midline."],
      ["Lingual","The surface toward the tongue."],
      ["Labial","The surface of an anterior tooth toward the lips."],
      ["Buccal","The surface of a posterior tooth toward the cheek."],
      ["Facial","The surface toward the lips or cheeks. May be used for the labial surface of anterior teeth or the buccal surface of posterior teeth."],
      ["Incisal edge","The biting edge of the anterior teeth. Also called the incisal ridge."],
      ["Occlusal","The chewing surface of posterior teeth."],
      ["Proximal","Refers to any surface between two teeth."],
      ["Contact area","The area of the mesial or distal surface of a tooth that touches its neighbor in the arch."]
    ],
    rules:[
      "Anterior teeth have four surfaces and one edge: mesial, distal, labial, lingual, plus the incisal edge.",
      "Posterior teeth have five surfaces: mesial, distal, lingual, buccal, occlusal.",
      "Root surfaces are named exactly like the surfaces of crowns: mesial, distal, lingual, labial or buccal."
    ]},
    {h:"Line and point angles", defs:[
      ["Line angle","The line or angle formed by the junction of two crown surfaces. Its name is derived by combining the names of those two surfaces. There are eight line angles on each tooth."],
      ["Point angle","The point which is the junction of three crown surfaces. It takes the name of those three surfaces. There are four point angles on each tooth."]
    ],
    callout:"Naming convention: drop the 'al' from the end of the first surface and substitute an 'o.' Where two o's would be adjacent, separate them with a hyphen — bucco-occlusal, mesiolinguo-occlusal.",
    table:{head:["","Anterior (8 line angles)","Posterior (8 line angles)"],rows:[
      ["Proximal + facial","Mesiolabial, Distolabial","Mesiobuccal, Distobuccal"],
      ["Proximal + lingual","Mesiolingual, Distolingual","Mesiolingual, Distolingual"],
      ["Facial/lingual + biting surface","Labioincisal, Linguoincisal","Bucco-occlusal, Linguo-occlusal"],
      ["Proximal + biting surface","Mesioincisal, Distoincisal","Mesio-occlusal, Disto-occlusal"]
    ]},
    rules:[
      "Point angles of anterior teeth: mesiolabioincisal, mesiolinguoincisal, distolabioincisal, distolinguoincisal.",
      "Point angles of posterior teeth: mesiobucco-occlusal, mesiolinguo-occlusal, distobucco-occlusal, distolinguo-occlusal."
    ]},
    {h:"Thirds of crown and root", table:{head:["Division","View","Thirds"],rows:[
      ["Vertical, crown","Proximal","Labial (buccal) — middle — lingual"],
      ["Vertical, crown","Facial or lingual","Mesial — middle — distal"],
      ["Horizontal, crown","Any","Incisal — middle — cervical"],
      ["Horizontal, root","Any","Cervical — middle — apical"]
    ]}}
  ],
  traps:[
    ["Anatomical vs. clinical","Anatomical is defined by tissue coverage — enamel for crown, cementum for root. Clinical is defined by visibility in the mouth. As gingiva recedes, the clinical crown gets longer while the anatomical crown never changes."],
    ["8 line angles, 4 point angles","Both anterior and posterior teeth have eight line angles and four point angles. The names differ, the counts do not."],
    ["Cervical line = CEJ","Two names for the same structure. It separates anatomical crown from anatomical root — not clinical."]
  ],
  questions:[
    {q:"A patient with severe gingival recession has 11 mm of tooth visible in the mouth, but enamel covers only the coronal 9 mm. What is the length of the anatomical crown?",o:["11 mm","9 mm","2 mm","20 mm"],a:1,e:"The anatomical crown is the portion covered by enamel — 9 mm. The 11 mm figure is the clinical crown, the portion visible in the mouth. Recession lengthens the clinical crown but never changes the anatomical crown."},
    {q:"Which dentition classification describes humans having two separate sets of teeth?",o:["Heterodont","Diphyodont","Polyphyodont","Monophyodont"],a:1,e:"Diphyodont means two separate sets — deciduous and permanent. Humans are both heterodont (different classes of teeth) and diphyodont, which is a common pairing on exams."},
    {q:"How many teeth are in one quadrant of the permanent dentition?",o:["5","7","8","10"],a:2,e:"Eight: 2 incisors, 1 canine, 2 premolars, 3 molars. The deciduous quadrant has 5 — no premolars, and only two molars."},
    {q:"Sharks continually develop new sets of teeth throughout life. This dentition is best described as:",o:["Monophyodont","Diphyodont","Polyphyodont","Homodont"],a:2,e:"Polyphyodont dentition has more than two sets, or continuous sets developed throughout life. Homodont describes the form of the teeth being all alike, which is a separate axis of classification."},
    {q:"In the deciduous dentition, which teeth are classified as posterior?",o:["The premolars and molars","The two molars in each quadrant","The canines and molars","The first molars only"],a:1,e:"The deciduous dentition has no premolars, so the posterior teeth are the two molars per quadrant. The premolars-and-molars answer applies to the permanent dentition."},
    {q:"A dental formula must be multiplied by which factor to give the number of teeth in the entire dentition?",o:["Two","Four","Eight","It already represents the whole dentition"],a:0,e:"A dental formula indicates the dentition of only one side of the mouth, so it is multiplied by two."},
    {q:"The internal line where dentin and enamel meet in the anatomical crown is the:",o:["CEJ","Cervical line","DEJ","Pulp horn"],a:2,e:"The dentino-enamel junction is internal. The cemento-enamel junction — also called the cervical line — is on the external surface where enamel and cementum meet."},
    {q:"Which structure separates the anatomical crown from the anatomical root?",o:["The gingival margin","The cervical line","The dentino-enamel junction","The height of contour"],a:1,e:"The cervical line, or CEJ, separates anatomical crown from anatomical root. The gingival margin separates clinical crown from clinical root."},
    {q:"Pulp horns most often correspond to which coronal features?",o:["The fossae and grooves","The cusps or lobes","The contact areas","The marginal ridges"],a:1,e:"Pulp horns are the pointed incisal or occlusal elongations of the pulp chamber, and they often correspond to the cusps, or lobes, of the tooth."},
    {q:"The bony socket into which an individual tooth is set is called the:",o:["Alveolar process","Alveolus","Periodontal ligament","Cementum"],a:1,e:"The alveolus is the individual socket; the alveolar process is the entire bony entity supporting all the teeth in a jaw."},
    {q:"On a permanent maxillary first molar, the surface toward the cheek is correctly named:",o:["Labial","Facial only","Buccal","Lingual"],a:2,e:"Buccal is the correct term for the cheek-facing surface of a posterior tooth. Facial is acceptable as a general term covering both labial and buccal, but buccal is the specific name."},
    {q:"How many surfaces and edges does an anterior tooth have?",o:["Five surfaces","Four surfaces and one edge","Three surfaces and two edges","Five surfaces and one edge"],a:1,e:"Anterior teeth have four surfaces — mesial, distal, labial, lingual — plus the incisal edge. Posterior teeth have five surfaces, with the occlusal counted as a surface."},
    {q:"How many line angles and point angles does a single tooth have?",o:["Eight line angles and four point angles","Four line angles and eight point angles","Six line angles and four point angles","Eight of each"],a:0,e:"Eight line angles — junctions of two surfaces — and four point angles, each a junction of three surfaces."},
    {q:"Which of the following is a correctly named line angle of a posterior tooth?",o:["Distolabial","Bucco-occlusal","Labioincisal","Mesiolabioincisal"],a:1,e:"Bucco-occlusal is a posterior line angle, with a hyphen separating the two adjacent o's. Distolabial and labioincisal are anterior line angles, and mesiolabioincisal is an anterior point angle."},
    {q:"Why is the posterior line angle written 'linguo-occlusal' rather than 'linguoocclusal'?",o:["Because the lingual surface is named first by convention","Because two adjacent o's are separated by a hyphen","Because point angles always take hyphens","Because occlusal cannot be shortened"],a:1,e:"Dropping the 'al' from lingual and substituting an 'o' would place two o's side by side, so a hyphen separates them."},
    {q:"Which is a point angle of an anterior tooth?",o:["Mesiolingual","Distolinguoincisal","Disto-occlusal","Linguoincisal"],a:1,e:"Distolinguoincisal joins three surfaces — distal, lingual, incisal — so it is a point angle. Mesiolingual and linguoincisal join only two surfaces."},
    {q:"Viewed from the proximal aspect, the crown divides vertically into which thirds?",o:["Mesial, middle, distal","Incisal, middle, cervical","Labial, middle, lingual","Cervical, middle, apical"],a:2,e:"From the proximal you see the facial-to-lingual dimension, so the vertical divisions are labial (buccal), middle, and lingual. Mesial-middle-distal is the vertical division seen from the facial or lingual view."},
    {q:"The root divides horizontally into which thirds?",o:["Incisal, middle, cervical","Cervical, middle, apical","Labial, middle, lingual","Mesial, middle, distal"],a:1,e:"Root thirds run cervical, middle, apical. Crown horizontal thirds run incisal (or occlusal), middle, cervical."},
    {q:"Which term describes any surface between two teeth?",o:["Contact area","Proximal","Interproximal papilla","Facial"],a:1,e:"Proximal refers to any surface between two teeth. The contact area is the specific spot on a proximal surface that actually touches the neighboring tooth."},
    {q:"Which tissue forms the main body of the tooth?",o:["Enamel","Cementum","Dentin","Pulp"],a:2,e:"Dentin forms the main body. Enamel covers the dentin of the anatomical crown and cementum covers the dentin of the anatomical root."},
    {q:"A 9-year-old presents with both deciduous and permanent teeth in the arch. Which dentition period is this?",o:["Primary","Mixed","Permanent","Succedaneous"],a:1,e:"The mixed dentition period runs roughly from 6 to 12 years, when both deciduous and permanent teeth are present."},
    {q:"Which quadrant is designated Q3?",o:["Maxillary right","Maxillary left","Mandibular left","Mandibular right"],a:2,e:"Numbering runs clockwise from the clinician's view: Q1 maxillary right, Q2 maxillary left, Q3 mandibular left, Q4 mandibular right."}
  ]
},
{
  id:"oral", code:"02", title:"Oral Anatomy",
  short:"Oral Anatomy",
  source:"Parts 1 & 2 of 2",
  blurb:"Elevations and depressions on coronal surfaces, then the soft tissue: gingiva, mucosa, palate and the structures that surround the teeth.",
  sections:[
    {h:"Crown elevations", defs:[
      ["Cusp","An elevation or mound on the crown portion of a tooth making up a divisional part of the occlusal surface. Premolars have 2–3; molars have 4 or more; canines normally exhibit one cusp forming the incisal portion of the crown; incisors do not possess cusps."],
      ["Tubercle","A smaller elevation on some portion of the crown produced by an extra formation of enamel. These are deviations from typical form, vary in size and shape, and are usually smaller than cusps. Commonly on the lingual surface of maxillary teeth and maxillary molars. The cusp of Carabelli, on maxillary first molars, is the classic example."],
      ["Cingulum","A large rounded eminence on the lingual surface of all anterior teeth, in both permanent and deciduous dentitions. It encompasses the entire cervical third of the lingual surface."],
      ["Mamelons","Any one of the three rounded protuberances of enamel found on the incisal ridges of newly erupted incisor teeth."]
    ]},
    {h:"Ridges", callout:"A ridge is any linear elevation on the surface of a tooth, named according to its location.",
    defs:[
      ["Marginal ridge","The rounded borders of enamel forming the mesial and distal margins of the occlusal surfaces of premolars and molars — and also the mesial and distal margins of the lingual surfaces of incisors and canines."],
      ["Triangular ridge","Descends from the tips of the cusps of molars and premolars toward the central part of the occlusal surface. The slopes of each side incline to resemble two sides of a triangle. Named after the cusp to which it belongs — for example, the triangular ridge of the distobuccal cusp of the mandibular second molar."],
      ["Transverse ridge","The union of two triangular ridges crossing transversely the surface of a posterior tooth."],
      ["Oblique ridge","A ridge crossing obliquely the occlusal surfaces of maxillary molars. Formed by the union of the triangular ridge of the distobuccal cusp and the distal cusp ridge of the mesiolingual cusp."],
      ["Cusp ridge","The ridges that radiate from the tips of cusps. There are four cusp ridges per cusp, named according to the direction they extend from the cusp tip. The cusp ridge running toward the central portion of the tooth is also known as the triangular ridge."],
      ["Inclined plane","The sloping area found between two cusp ridges, named by combining the names of the two cusp ridges between which it lies — for example the distobuccal inclined plane of the buccal cusp. Each cusp exhibits four inclined planes."]
    ]},
    {h:"Crown depressions", defs:[
      ["Fossa","An irregular depression or concavity. Plural: fossae."],
      ["Lingual fossa","An irregular depression present on the lingual surface of incisors."],
      ["Central fossa","An irregular depression on the occlusal surface of molars, formed by the convergence of ridges terminating at a central point in the bottom of the depression, where there is a junction of grooves."],
      ["Triangular fossa","An irregular depression present on molars and premolars on the occlusal surfaces mesial and distal to the marginal ridges. Abbreviated MTF and DTF."],
      ["Developmental groove","Also called a primary groove. A shallow groove or line between the primary parts of a crown or root. Specific types include the buccal, lingual and central grooves."],
      ["Supplemental groove","Also called a secondary groove. A shallow linear depression branching from developmental grooves. It does not mark the junction of primary parts and is usually less distinct."],
      ["Pit","A small pinpoint depression located at the junction of developmental grooves or at the terminals of those grooves. Usually found in the deepest portion of a fossa."]
    ],
    rules:["Pit locations on the mandibular first molar: central, mesial, distal, buccal, distobuccal, and lingual pits."]},
    {h:"Other coronal structures", defs:[
      ["Contact area","The area on the proximal surface of the crown that contacts the adjacent tooth in the same arch. Each tooth normally has two — mesial and distal. The exception is the most distal tooth in the arch, which has only a mesial contact."],
      ["Lobe","One of the primary sections of formation in the development of the crown. Lobes are often separated by developmental grooves; cusps and mamelons are representative of lobes."]
    ]},
    {h:"Gingiva and mucosa", defs:[
      ["Marginal gingiva","Also called unattached gingiva or the free gingival margin. The terminal edge or border of the gingiva that surrounds the teeth in a collar-like fashion. Usually about 1 mm wide. It forms the soft tissue wall of the gingival sulcus."],
      ["Gingival sulcus","The shallow crevice or space around the tooth, bounded by the surface of the tooth on one side and the epithelial lining of the free margin of the gingiva on the other."],
      ["Attached gingiva","The gingiva bound to the underlying periosteum of the alveolar bone. Continuous with the marginal gingiva."],
      ["Mucogingival junction","An anatomical feature on the intraoral mucosa demarcating the border between the moveable (alveolar) mucosa and the attached mucosa. The mucosa of the cheeks and floor of mouth is freely moveable and fragile; the mucosa around the teeth and on the palate is firm and keratinized."],
      ["Alveolar mucosa","Also called oral mucosa. The mucosal lining present over the alveolar bone, continuous with the lining of the lip, cheek, and floor of the mouth."],
      ["Interdental papillae","The gingival tissue that occupies the interproximal space beneath the area of tooth contact."],
      ["Col","A valley-like depression connecting a facial and a lingual papilla, conforming to the shape of the interproximal contact."],
      ["Gingival fibers","The connective tissue fibers inhabiting the gingival tissue adjacent to teeth, helping hold the tissue firmly against them. Primarily type I collagen, though type III fibers are also involved."],
      ["Periodontal ligament","The fibrous connective tissue structure joining the cementum covering the root to the alveolar bone. It has neural and vascular components."],
      ["Sharpey's fibers","The terminal ends of the principal fibers of the periodontal ligament that are embedded in the cementum or the alveolar bone."]
    ]},
    {h:"Oral landmarks", defs:[
      ["Frenulum","A small fold of mucous membrane extending from the gingiva to the lips or tongue. Types include the labial frenum and lingual frenum."],
      ["Vestibule","The area between the teeth, lips and cheeks. Both maxillary and mandibular."],
      ["Hard palate","The anterior portion of the palate separating the oral and nasal cavities, consisting of bony framework and covering membranes. It spans the arch formed by the upper teeth and is formed by the palatine process of the maxilla and the horizontal plate of the palatine bone."],
      ["Palatal rugae","Also palatine rugae. The ridges on the anterior part of the palatal mucosa."],
      ["Incisive papilla","Also palatine papilla. A small pear- or oval-shaped mucosal prominence at the midline of the palate, posterior to the lingual surface of the central incisors."],
      ["Soft palate","The fleshy part of the palate extending from the posterior edge of the hard palate. The uvula projects from its free inferior border."],
      ["Uvula","A conic projection from the posterior edge of the middle of the soft palate."],
      ["Fovea palatina","Also palatine fovea. A pair of small pits situated at or near the junction of the hard and soft palate, just lateral to the midline. They are the orifices through which some of the ducts of the minor mucous glands of the palate empty."]
    ]}
  ],
  traps:[
    ["Developmental vs. supplemental groove","A developmental (primary) groove marks the junction of primary parts of the crown. A supplemental (secondary) groove branches off it, does not mark a junction of primary parts, and is less distinct."],
    ["Cusp vs. tubercle","A cusp is a normal divisional part of the occlusal surface. A tubercle is an extra formation of enamel and a deviation from typical form — the cusp of Carabelli is the named example on maxillary first molars."],
    ["Marginal ridges appear on anteriors too","They are not exclusive to posterior occlusal surfaces. On incisors and canines, marginal ridges form the mesial and distal margins of the lingual surface."],
    ["Oblique ridge is maxillary molars only","And its two components are specific: the triangular ridge of the distobuccal cusp plus the distal cusp ridge of the mesiolingual cusp."]
  ],
  questions:[
    {q:"The cusp of Carabelli is best classified as a:",o:["Cusp","Tubercle","Lobe","Marginal ridge"],a:1,e:"It is a tubercle — a smaller elevation produced by an extra formation of enamel, a deviation from typical form. It is found on maxillary first molars."},
    {q:"Which of the following teeth do NOT possess cusps?",o:["Premolars","Canines","Incisors","Molars"],a:2,e:"Incisors do not possess cusps. Canines normally exhibit one cusp, premolars 2–3, and molars 4 or more."},
    {q:"The cingulum is found on:",o:["The occlusal surface of premolars","The lingual surface of all anterior teeth","The buccal surface of molars","The incisal ridge of newly erupted incisors"],a:1,e:"The cingulum is a large rounded eminence on the lingual surface of all anterior teeth, in both dentitions, encompassing the entire cervical third of the lingual surface."},
    {q:"The oblique ridge of a maxillary molar is formed by the union of which two structures?",o:["The triangular ridges of the mesiobuccal and mesiolingual cusps","The triangular ridge of the distobuccal cusp and the distal cusp ridge of the mesiolingual cusp","The mesial and distal marginal ridges","The triangular ridges of the distobuccal and distolingual cusps"],a:1,e:"Triangular ridge of the distobuccal cusp plus distal cusp ridge of the mesiolingual cusp. This exact pairing is a frequent exam item."},
    {q:"A transverse ridge is formed by:",o:["A ridge crossing obliquely across maxillary molars","The union of two triangular ridges crossing transversely on a posterior tooth","A cusp ridge running toward the central portion of the tooth","The rounded border of enamel at the occlusal margin"],a:1,e:"A transverse ridge is the union of two triangular ridges crossing transversely the surface of a posterior tooth. The oblique ridge is the maxillary-molar-specific version."},
    {q:"How many cusp ridges radiate from a single cusp tip?",o:["Two","Three","Four","Six"],a:2,e:"Four cusp ridges per cusp, named by the direction they extend. Each cusp also exhibits four inclined planes, which lie between adjacent cusp ridges."},
    {q:"The lingual cusp ridge of the mesiobuccal cusp is also known as the:",o:["Transverse ridge","Oblique ridge of that cusp","Triangular ridge of the mesiobuccal cusp","Marginal ridge"],a:2,e:"The cusp ridge that runs toward the central portion of the tooth is also known as the triangular ridge of that cusp."},
    {q:"Marginal ridges on an incisor are located on which surface?",o:["Labial","Lingual","Incisal","They do not occur on incisors"],a:1,e:"On incisors and canines, marginal ridges form the rounded mesial and distal margins of the lingual surface."},
    {q:"An irregular depression on the occlusal surface of a molar formed by the convergence of ridges at a central point where grooves join is the:",o:["Lingual fossa","Triangular fossa","Central fossa","Central pit"],a:2,e:"That is the central fossa. The pit is the pinpoint depression usually found in the deepest portion of a fossa."},
    {q:"Triangular fossae are found:",o:["On the lingual surfaces of incisors","On occlusal surfaces mesial and distal to the marginal ridges","Only on maxillary molars","At the junction of the buccal and lingual grooves"],a:1,e:"Triangular fossae occur on molars and premolars, on the occlusal surfaces mesial and distal to the marginal ridges — abbreviated MTF and DTF."},
    {q:"A shallow linear depression branching off a central groove, which does not mark the junction of primary parts, is a:",o:["Developmental groove","Primary groove","Supplemental groove","Pit"],a:2,e:"That describes a supplemental, or secondary, groove. Developmental and primary groove are two names for the same thing, and that structure does mark a junction of primary parts."},
    {q:"Which structure is defined as a small pinpoint depression at the junction or terminal of developmental grooves?",o:["Fossa","Pit","Col","Inclined plane"],a:1,e:"A pit, usually found in the deepest portion of a fossa."},
    {q:"A patient's maxillary second molar is the most distal tooth in that quadrant. How many contact areas does it normally have?",o:["None","One — mesial only","One — distal only","Two"],a:1,e:"Each tooth normally has two contact areas, mesial and distal. The exception is the most distal tooth in the arch, which has a mesial contact only."},
    {q:"Cusps and mamelons are representative of:",o:["Tubercles","Lobes","Ridges","Fossae"],a:1,e:"A lobe is one of the primary sections of formation in the development of the crown, often separated by developmental grooves. Cusps and mamelons are the visible representatives of lobes."},
    {q:"The soft tissue wall of the gingival sulcus is formed by the:",o:["Attached gingiva","Marginal gingiva","Alveolar mucosa","Interdental papilla"],a:1,e:"The marginal (free) gingiva, about 1 mm wide, forms the soft tissue wall of the sulcus. The attached gingiva is bound to the periosteum of alveolar bone."},
    {q:"The valley-like depression connecting a facial and a lingual papilla is called the:",o:["Sulcus","Col","Vestibule","Fovea"],a:1,e:"The col conforms to the shape of the interproximal contact and connects the facial and lingual papillae."},
    {q:"The border between moveable alveolar mucosa and firm attached mucosa is the:",o:["Gingival margin","Mucogingival junction","Cervical line","Col"],a:1,e:"The mucogingival junction demarcates this border. The mucosa around the teeth and on the palate is firm and keratinized; the cheek and floor of mouth mucosa is freely moveable and fragile."},
    {q:"Gingival fibers are primarily composed of which collagen type?",o:["Type I, with type III also involved","Type II only","Type III, with type I also involved","Type IV"],a:0,e:"Primarily type I collagen, although type III fibers are also involved."},
    {q:"Sharpey's fibers are best described as:",o:["The entire periodontal ligament","The terminal ends of principal fibers embedded in cementum or alveolar bone","The fibers holding gingiva against the tooth","Elastic fibers of the retrodiscal tissue"],a:1,e:"Sharpey's fibers are the embedded terminal ends of the principal fibers of the periodontal ligament."},
    {q:"The hard palate is formed by the palatine process of the maxilla and the:",o:["Vomer","Horizontal plate of the palatine bone","Pterygoid plate of the sphenoid","Zygomatic process"],a:1,e:"Palatine process of the maxilla plus the horizontal plate of the palatine bone."},
    {q:"The small pear- or oval-shaped mucosal prominence at the midline of the palate, just posterior to the lingual surface of the central incisors, is the:",o:["Palatal rugae","Fovea palatina","Incisive papilla","Uvula"],a:2,e:"The incisive, or palatine, papilla. The fovea palatina are a pair of pits near the junction of hard and soft palate, lateral to the midline."},
    {q:"The fovea palatina are:",o:["Ridges on the anterior palatal mucosa","A pair of small pits near the hard-soft palate junction, lateral to the midline","A single midline prominence behind the central incisors","The projection from the soft palate"],a:1,e:"They are the orifices through which some ducts of the minor mucous glands of the palate empty."}
  ]
},
{
  id:"form", code:"03", title:"Form & Function",
  short:"Form & Function",
  source:"Parts 1 & 2 of 2",
  blurb:"Why teeth are shaped the way they are. Lobes, occlusal curvatures, axial position, geometric crown outlines, contacts and embrasures, height of contour, cervical line curvature, root form.",
  sections:[
    {h:"Function and the periodontium", rules:[
      "Three main functions of the human dentition: mastication (chewing), esthetics (appearance), phonetics (speech).",
      "The periodontium is the supporting tissues, both hard and soft, of a tooth. Without proper natural tooth form the periodontium may suffer the consequences.",
      "Dentist-induced (iatrogenic) imperfections may also lead to breakdown of the periodontium."
    ]},
    {h:"Lobes", callout:"A lobe is a primary division of the tooth. Learn the count and the exceptions — this is heavily tested.",
    table:{head:["Tooth group","Lobes","Composition"],rows:[
      ["All anterior teeth","4","3 labial (mesiolabial, middle labial, distolabial) + 1 lingual (the cingulum)"],
      ["Maxillary premolars & mandibular 1st premolar","4","3 buccal + 1 lingual"],
      ["Mandibular 2nd premolar","5","3 buccal + 2 lingual (mesiolingual, distolingual)"],
      ["Maxillary molars","4","2 buccal (MB, DB) + 2 lingual (ML, DL)"],
      ["Mandibular 1st molar","5","3 buccal (MB, DB, distal) + 2 lingual (ML, DL)"],
      ["Other mandibular teeth","4","2 buccal + 2 lingual"]
    ]},
    rules:[
      "Anterior teeth: the three labial lobes are sometimes visible on newly erupted incisors as mamelons. Two shallow developmental depressions — mesiolabial and distolabial — are further evidence of the three labial lobes, usually seen in the incisal portion.",
      "Premolar lobe separation: the central groove separates buccal from lingual lobes; a lingual groove, if present, separates mesiolingual from distolingual; developmental depressions divide the three buccal lobes.",
      "Maxillary molar lobe separation: central groove separates buccal from lingual; distolingual groove separates the two lingual lobes; buccal groove separates the two buccal lobes. Molars do not exhibit developmental depressions.",
      "Mandibular first molar lobe separation: central groove (buccal from lingual), buccal groove (mesiobuccal from distobuccal), distobuccal groove (distobuccal from distal), lingual groove (mesiolingual from distolingual)."
    ]},
    {h:"General occlusal curvatures", table:{head:["","Curve of Spee","Curve of Wilson","Sphere of Monson"],rows:[
      ["Plane","Anterior–posterior","Medio-lateral","Three-dimensional"],
      ["Description","2-D curve of the occlusal plane beginning at the tip of the canines and following the buccal cusp tips of the premolars and molars posteriorly","2-D curve of the occlusal plane in a medio-lateral direction","Combination of the Curve of Spee and the Curve of Wilson; also called the compensating occlusal curvature"],
      ["Maxillary root inclination","Mesial","Lingual","—"],
      ["Mandibular root inclination","Distal","Buccal","—"],
      ["Note","Crowns incline in the opposite direction to the roots","Crowns incline in the opposite direction to the roots","Curvature is concave for the mandibular arch and convex for the maxillary arch"]
    ]}},
    {h:"Axial position", callout:"Axial position is the angulation of the teeth with respect to the alveolar bone, described in a mesiodistal or faciolingual direction. It can describe inclination of the crown or of the root.",
    table:{head:["Tooth group","Faciolingual root inclination","Mesiodistal root inclination"],rows:[
      ["Maxillary anteriors","Lingual (palate)","Incisor roots nearly straight; canine root distal"],
      ["Maxillary premolars","Slightly lingual","Slightly distal"],
      ["Maxillary molars","Lingual","Distal"],
      ["Mandibular anteriors","Lingual","Incisor roots nearly straight; canine root slightly distal"],
      ["Mandibular premolars","1st slightly lingual; 2nd slightly buccal","Distal"],
      ["Mandibular molars","Buccal","Distal"]
    ]}},
    {h:"Geometric crown outlines", table:{head:["Aspect","Anterior teeth","Posterior teeth"],rows:[
      ["Facial and lingual","Trapezoid, longest parallel side toward the incisal","Trapezoid, longest parallel side toward the occlusal"],
      ["Mesial and distal","Triangle — base at the cervical, apex at the incisal","Maxillary: trapezoid with the shortest parallel side toward the occlusal. Mandibular: rhomboid, crowns inclined toward the lingual"]
    ]},
    rules:[
      "All permanent teeth from the facial and lingual can be roughly described as trapezoidal: longer parallel side at the incisal or occlusal, shorter at the cervical. Arranged side by side, these create interproximal spaces and contact areas.",
      "Anterior proximal form: a wide base gives the crown strength, and tapered outlines narrowing to a relatively thin ridge facilitate penetration of food material.",
      "Maxillary posterior proximal form: because the occlusal surface is constricted, the tooth can be forced into food more easily. If the occlusal surface were as wide as the base of the crown, the additional chewing surface would multiply the forces of mastication.",
      "Mandibular posterior proximal form: if these crowns were set on their roots in the same crown-to-root relation as the maxillary posteriors, the cusps would clash. The rhomboidal form and lingual inclination allow proper interlocking during mastication.",
      "Each tooth in each arch has two antagonists in the opposing arch except the mandibular central incisor and the maxillary third molar."
    ]},
    {h:"Contact areas", rules:[
      "Contact areas normally increase in size with age, due to abrasion occurring between the proximal surfaces.",
      "Proper location aids stabilization of the dental arch and prevents food from slipping between the teeth.",
      "Rule 1 — contact areas become more cervically located from anterior to posterior.",
      "Rule 2 — on an individual tooth, the distal contact is more cervical than the mesial contact.",
      "Rule 3 — size increases from anterior to posterior.",
      "Rule 4 — anterior contact areas are normally centered labiolingually.",
      "Rule 5 — posterior contact areas are normally located buccal of center buccolingually."
    ]},
    {h:"Interproximal spaces", defs:[
      ["Interproximal space","The triangular shaped area between adjacent teeth in the same arch, cervical to the contact area. Usually filled with the interdental papilla."]
    ],
    rules:["The triangle is formed by alveolar bone at its base, the proximal surfaces of the adjacent teeth on its sides, and the contact area of the adjacent teeth at its apex."]},
    {h:"Embrasures", defs:[
      ["Embrasure","The open space between the proximal surfaces of two adjacent teeth in the same arch, where they diverge facially or lingually and incisally (occlusally) or cervically from the contact area. It provides a passage through which food escapes from the occlusal surfaces during mastication."]
    ],
    rules:[
      "From a facial or lingual view: the incisal (occlusal) embrasure and the cervical (gingival) embrasure. The cervical embrasure corresponds to the interproximal space.",
      "From an incisal or occlusal view: the facial (labial, buccal) embrasure and the lingual embrasure.",
      "An imaginary line bisecting the embrasure space should give two equal areas of similar size and shape.",
      "Two main physiological purposes: to serve as a spillway for food material during mastication, and to serve as an integral part of the self-cleaning process of the teeth.",
      "Rule 1 — incisal (occlusal) embrasures increase in relative size from anterior to posterior.",
      "Rule 2 — cervical (gingival) embrasures decrease in relative size from anterior to posterior.",
      "Rule 3 — labial and lingual embrasures are nearly equal in size in anterior teeth.",
      "Rule 4 — the lingual embrasure is normally larger than the buccal embrasure in posterior teeth.",
      "Rule 5 — when one side of an embrasure has a certain contour, the other side normally has a similar contour."
    ],
    callout:"Tie it together: as the contact area moves more cervically toward the posterior, the incisal (occlusal) embrasure gets relatively larger while the cervical embrasure gets smaller. As the contact moves farther buccally in posterior teeth, the lingual embrasure becomes relatively larger."},
    {h:"Facial line angles", rules:[
      "Line angles are more noticeable when viewed from the incisal (occlusal) aspect.",
      "The line angles are the termination of the embrasure.",
      "There should be symmetry in the location of the line angles of adjacent teeth. For example, the mesiolabial line angle of a canine should be located directly adjacent to the distolabial line angle of the adjacent lateral incisor — not farther labially or lingually."
    ]},
    {h:"Height of contour", defs:[
      ["Height of contour","Also called the crest of curvature. The greatest area of contour incisocervically (occlusocervically) on the facial and lingual surfaces. It is best observed by viewing these surface outlines from the proximal."]
    ],
    rules:[
      "Mesial and distal surfaces also have heights of contour, but these are normally located at the contact areas.",
      "These contours play an important role in the physiology and health of the periodontium, aiding proper protection and stimulation of the gingival tissues.",
      "Rule 1 — the height of contour on the facial surfaces of all anterior and posterior teeth is located in the cervical third.",
      "Rule 2 — on anterior lingual surfaces, the height of contour is located in the cervical third.",
      "Rule 3 — on posterior lingual surfaces, the height of contour is located in the middle or occlusal third."
    ]},
    {h:"Cervical line and gingival line", table:{head:["","Cervical line","Gingival line"],rows:[
      ["Also called","CEJ, cemento-enamel junction","Gingival margin, gingival crest"],
      ["Definition","The line around the tooth where the enamel and cementum meet","The imaginary line marking the level of termination of the nonattached soft tissue surrounding the tooth"],
      ["Stability","A stable entity — does not change","A variable entity — can change throughout the patient's life"],
      ["Separates","Anatomical crown from anatomical root","Clinical crown from clinical root"]
    ]},
    rules:[
      "The amount of curvature of the cervical line seems to be related to the width and length of the crown, as well as the location of the contact areas. Two factors describe it: direction of curvature and depth of curvature.",
      "Rule 1 — the cervical line is normally curved (convex), or bulges, toward the apical on the facial and lingual surfaces.",
      "Rule 2 — the cervical line is normally curved (convex) toward the incisal (occlusal) on the mesial and distal surfaces.",
      "Rule 3 — the depth of cervical line curvature on any individual tooth is normally greater on the mesial than on the distal surface.",
      "Rule 4 — cervical lines on adjacent proximal surfaces of adjacent teeth have approximately the same depth of curvature.",
      "Rule 5 — the depth of the curvature on all surfaces is greater on central incisors and decreases posteriorly."
    ]},
    {h:"Continuity of marginal ridges and central grooves", rules:[
      "The height of the marginal ridges of adjacent teeth in the same arch should be at the same level.",
      "Adjacent marginal ridges are normally shaped so that they create a small occlusal embrasure between posterior teeth, or a lingual embrasure between anterior teeth.",
      "Central grooves are aligned into one continuous valley in each quadrant, allowing a trough antero-posteriorly through the centers of the occlusal surfaces of the posterior teeth, which allows a more efficient food flow pattern during mastication."
    ]},
    {h:"Root shape", table:{head:["Number of roots","Teeth","Detail"],rows:[
      ["One","Anterior teeth and premolars","Exception: the maxillary first premolar"],
      ["Two","Maxillary first premolar","One buccal and one palatal (lingual) root"],
      ["Two","Mandibular molars","One mesial and one distal root"],
      ["Three","Maxillary molars","One mesiobuccal, one distobuccal, and one palatal root"]
    ]},
    rules:["Roots are normally widest toward the cervical area and taper toward the apex."]}
  ],
  traps:[
    ["Spee vs. Wilson root inclinations","Spee is anterior–posterior: maxillary roots mesial, mandibular roots distal. Wilson is medio-lateral: maxillary roots lingual, mandibular roots buccal. In both, the crowns incline opposite to the roots."],
    ["Five-lobe exceptions","Only two teeth break the four-lobe rule in this lecture: the mandibular second premolar and the mandibular first molar. Both get five."],
    ["Trapezoid direction flips","Facial and lingual aspects: longest parallel side toward the occlusal or incisal. Mesial and distal of maxillary posteriors: shortest parallel side toward the occlusal. The direction of the trapezoid is the whole question."],
    ["Height of contour, posterior lingual","Facial surfaces are always cervical third. Anterior lingual is cervical third. Only the posterior lingual moves to the middle or occlusal third."],
    ["Embrasure rules run opposite","Incisal/occlusal embrasures increase anterior to posterior; cervical embrasures decrease. Contact areas move more cervical going posteriorly, which is what drives both."],
    ["Two antagonists, two exceptions","Every tooth has two antagonists in the opposing arch except the mandibular central incisor and the maxillary third molar."]
  ],
  questions:[
    {q:"Which two teeth are the exceptions to the four-lobe rule, each having five lobes?",o:["Maxillary first premolar and maxillary first molar","Mandibular second premolar and mandibular first molar","Mandibular first premolar and mandibular second molar","Maxillary second premolar and mandibular first molar"],a:1,e:"The mandibular second premolar (3 buccal + 2 lingual) and the mandibular first molar (3 buccal including the distal lobe, + 2 lingual)."},
    {q:"The lingual lobe of an anterior tooth is represented by which structure?",o:["The lingual fossa","The cingulum","The marginal ridge","The incisal ridge"],a:1,e:"All anterior teeth have four lobes: three labial and one lingual, and the lingual lobe is the cingulum."},
    {q:"On a mandibular first molar, which groove separates the distobuccal lobe from the distal lobe?",o:["Buccal groove","Central groove","Distobuccal groove","Lingual groove"],a:2,e:"The buccal groove separates mesiobuccal from distobuccal; the distobuccal groove separates distobuccal from the distal lobe. The distal lobe is what makes this tooth a five-lobe exception."},
    {q:"Which teeth do NOT exhibit developmental depressions as evidence of lobe separation?",o:["Anterior teeth","Premolars","Molars","Mandibular second premolars"],a:2,e:"Molars do not exhibit developmental depressions. Anterior teeth show mesiolabial and distolabial depressions, and premolars show them between the three buccal lobes."},
    {q:"To form the Curve of Spee, the roots of the maxillary teeth are inclined toward the:",o:["Distal","Mesial","Buccal","Lingual"],a:1,e:"Maxillary roots incline mesially and mandibular roots incline distally for the Curve of Spee. The crowns incline in the opposite direction."},
    {q:"To form the Curve of Wilson, the roots of the mandibular teeth are inclined toward the:",o:["Mesial","Distal","Buccal","Lingual"],a:2,e:"Wilson is medio-lateral: mandibular roots incline buccally, maxillary roots incline lingually."},
    {q:"The Sphere of Monson is best described as:",o:["A two-dimensional anterior-posterior curve","A two-dimensional medio-lateral curve","The three-dimensional combination of the Curves of Spee and Wilson","The curvature of the cervical line"],a:2,e:"Also called the compensating occlusal curvature. It is concave for the mandibular arch and convex for the maxillary arch."},
    {q:"The Curve of Spee begins at which landmark?",o:["The mesial contact of the central incisor","The tip of the canines","The mesiobuccal cusp of the first molar","The distal marginal ridge of the second premolar"],a:1,e:"It begins at the tip of the canines and follows the buccal cusp tips of the premolars and molars posteriorly."},
    {q:"Which mandibular teeth have roots that incline slightly toward the buccal?",o:["Mandibular first premolars","Mandibular second premolars","Mandibular canines","Mandibular incisors"],a:1,e:"Mandibular second premolar roots incline slightly buccally while first premolar roots incline slightly lingually. Both incline distally in the mesiodistal direction."},
    {q:"From the proximal view, the crown of a mandibular posterior tooth is described as which geometric shape?",o:["Triangle","Trapezoid with the longer parallel side at the cervical","Rhomboid","Trapezoid with the longer parallel side at the occlusal"],a:2,e:"Mandibular posterior crowns are rhomboidal from the proximal and are inclined toward the lingual, which allows proper interlocking with the maxillary posteriors."},
    {q:"From the mesial or distal, a maxillary posterior crown is a trapezoid with:",o:["The shortest parallel side toward the occlusal","The longest parallel side toward the occlusal","Equal parallel sides","No parallel sides"],a:0,e:"The constricted occlusal surface lets the tooth be forced into food more easily. If the occlusal were as wide as the base, the extra chewing surface would multiply the forces of mastication."},
    {q:"The mesial and distal aspects of anterior teeth are which shape?",o:["Trapezoid","Rhomboid","Triangle with the base at the cervical","Triangle with the base at the incisal"],a:2,e:"A triangle with the base at the cervical and the apex at the incisal. The wide base gives strength and the tapered outline facilitates penetration of food."},
    {q:"Which two teeth have only one antagonist in the opposing arch?",o:["Maxillary central incisor and mandibular third molar","Mandibular central incisor and maxillary third molar","Maxillary lateral incisor and mandibular second molar","Mandibular canine and maxillary third molar"],a:1,e:"Every tooth has two antagonists except the mandibular central incisor and the maxillary third molar."},
    {q:"On an individual tooth, how does the distal contact area compare with the mesial?",o:["More cervical","More incisal","At the same level","More facial"],a:0,e:"On an individual tooth the distal contact is more cervical than the mesial. Separately, contacts also become more cervical as you move posteriorly through the arch."},
    {q:"Posterior contact areas are normally located where buccolingually?",o:["Centered","Buccal of center","Lingual of center","At the height of contour of the lingual surface"],a:1,e:"Posterior contacts sit buccal of center; anterior contacts are centered labiolingually. The buccal position is why the lingual embrasure of posterior teeth is relatively larger."},
    {q:"Contact areas normally increase in size with age because of:",o:["Continued enamel deposition","Abrasion between the proximal surfaces","Passive eruption","Cervical line resorption"],a:1,e:"Abrasion occurring between the proximal surfaces during function enlarges the contact area over time."},
    {q:"The interproximal space is bounded at its apex by which structure?",o:["The alveolar bone","The contact area of the adjacent teeth","The interdental papilla","The col"],a:1,e:"Alveolar bone forms the base, the proximal surfaces form the sides, and the contact area forms the apex. The space is usually filled with the interdental papilla."},
    {q:"Which embrasures increase in relative size from anterior to posterior?",o:["Cervical (gingival)","Incisal (occlusal)","Lingual only","Labial only"],a:1,e:"Incisal/occlusal embrasures increase posteriorly while cervical embrasures decrease. Both follow from contacts becoming more cervically located posteriorly."},
    {q:"In posterior teeth, how do the buccal and lingual embrasures compare?",o:["They are nearly equal","The buccal is normally larger","The lingual is normally larger","It varies unpredictably"],a:2,e:"The lingual embrasure is normally larger in posterior teeth, because the contact area is located buccal of center. In anterior teeth the labial and lingual embrasures are nearly equal."},
    {q:"The two main physiological purposes of embrasures are:",o:["Stabilizing the arch and protecting the papilla","Serving as a food spillway and aiding self-cleaning","Distributing occlusal force and protecting the pulp","Guiding eruption and maintaining arch length"],a:1,e:"They serve as a spillway for food material during mastication and as an integral part of the self-cleaning process of the teeth."},
    {q:"The height of contour on the lingual surface of a mandibular first molar is located in the:",o:["Cervical third","Middle or occlusal third","Incisal third","At the contact area"],a:1,e:"Posterior lingual surfaces are the exception — middle or occlusal third. Facial surfaces of all teeth and anterior lingual surfaces are in the cervical third."},
    {q:"Height of contour is best observed by viewing the tooth from which aspect?",o:["Facial","Lingual","Proximal","Occlusal"],a:2,e:"The facial and lingual surface outlines are best judged from the proximal view."},
    {q:"Which line is a variable entity that can change throughout the patient's life?",o:["The cervical line","The gingival line","The cemento-enamel junction","The dentino-enamel junction"],a:1,e:"The gingival line — also called the gingival margin or crest — is variable and separates clinical crown from clinical root. The cervical line/CEJ is stable and separates anatomical crown from anatomical root."},
    {q:"On the mesial and distal surfaces, the cervical line is normally convex toward the:",o:["Apical","Incisal (occlusal)","Facial","Lingual"],a:1,e:"On the proximal surfaces the cervical line curves toward the incisal or occlusal. On the facial and lingual surfaces it bulges toward the apical."},
    {q:"On any individual tooth, the depth of cervical line curvature is normally greater on which surface?",o:["Facial","Lingual","Mesial","Distal"],a:2,e:"Greater on the mesial than on the distal. Across the arch, the depth on all surfaces is greatest on the central incisors and decreases posteriorly."},
    {q:"Which tooth is the exception to the rule that anterior teeth and premolars have a single root?",o:["Mandibular first premolar","Maxillary second premolar","Maxillary first premolar","Maxillary canine"],a:2,e:"The maxillary first premolar normally has two root branches — one buccal and one palatal (lingual)."},
    {q:"A maxillary molar normally has which root configuration?",o:["One mesial and one distal","Two buccal and one palatal","One buccal and two palatal","Three buccal"],a:1,e:"Maxillary molars have three roots: mesiobuccal, distobuccal, and palatal. Mandibular molars have two: one mesial and one distal."},
    {q:"Continuity of central grooves through a quadrant serves primarily to:",o:["Increase the height of contour","Allow a more efficient food flow pattern during mastication","Align the marginal ridges","Distribute occlusal load to the periodontal ligament"],a:1,e:"Aligned central grooves create a trough antero-posteriorly through the centers of the occlusal surfaces, allowing efficient food flow."}
  ]
},
{
  id:"tmj", code:"04", title:"Temporomandibular Joint",
  short:"TMJ",
  source:"Parts 1 & 2 of 2",
  blurb:"Structure and function of the TMJ: osseous components, the articular disc, five ligaments, the four zones of the articulating surfaces, synovial lubrication, and biomechanics.",
  sections:[
    {h:"The masticatory system", rules:[
      "Components: the teeth, the maxilla, the mandible, the temporomandibular joints, the muscles of mastication (directly or indirectly), the vasculature, and the innervation."
    ]},
    {h:"TMJ overview", rules:[
      "The joint between the maxilla and the mandible. Osseous portions are the mandibular fossa, the articular eminence, and the condyle, with the articular disc located between the condyle and the temporal bone.",
      "The articular surface of the temporal bone consists of the mandibular fossa — the posterior concave portion — and the articular eminence — the anterior convex portion.",
      "It provides two types of movement: hinging or rotation, which makes it a ginglymoid joint, and gliding or translation, which makes it an arthrodial joint. Together: a ginglymoarthrodial joint.",
      "It is classified as a compound joint. The definition of a compound joint requires three bones, and the TMJ has only two — functionally, the articular disc serves as a nonossified bone permitting complex movement.",
      "It is enclosed in a capsule with an inner synovial layer and an outer fibrous layer containing veins, nerves and collagen fibers."
    ],
    table:{head:["System","Structures"],rows:[
      ["Innervation","Trigeminal nerve — auriculotemporal nerve provides the majority of innervation, with the deep temporal and masseteric nerves also contributing. The same nerve provides motor and sensory innervation to the muscles that control the joint."],
      ["Vasculature","Maxillary artery, temporal artery, masseteric artery."]
    ]}},
    {h:"Mandibular fossa", rules:[
      "An oval or oblong depression in the temporal bone. It varies in size from one person to another.",
      "Anterior border — the articular eminence.",
      "External border — the middle root of the zygoma and the auditory process.",
      "Posterior border — the tympanic plate of the petrous portion of the temporal bone, the nonarticulating portion of the fossa.",
      "Two bony processes, or lips, limit condylar displacement distally, laterally and vertically: the postglenoid tubercle laterally and the medial glenoid lip medially."
    ]},
    {h:"Condyle", rules:[
      "Knoblike, a modified barrel shape, wider lateromedially than anteroposteriorly. Varies from person to person.",
      "Convex on all bearing surfaces and perpendicular to the ascending ramus of the mandible.",
      "The long axes of the condyles lie in a lateral plane but are not on the same plane — a line drawn through them would meet anterior to the foramen magnum.",
      "The bony surface of the condyle and the articular part of the temporal bone are made up of dense cortical bone.",
      "Both are covered with dense fibrous connective tissue containing irregular cartilage-like cells, whose number apparently increases with age and with stress on the joint."
    ]},
    {h:"Articular disc", rules:[
      "The biconcave structure interposed between the condyle and the temporal bone. 'Meniscus' is an old term, no longer used.",
      "Shaped to accommodate the shape of the condyle and the concavity of the mandibular fossa. The disc divides the articular surface into upper and lower compartments.",
      "In the sagittal plane it has three regions: the intermediate or central zone, the anterior region and the posterior region. The anterior and posterior bands are thicker at 2–3 mm and the central zone is thin at about 1 mm. The posterior band is generally slightly thicker than the anterior band.",
      "In the coronal plane it has medial, lateral and central portions. The medial portion is generally thicker than the lateral, corresponding to the increased space between the condyle and the articular fossa toward the medial of the joint.",
      "The articular surface of the condyle is located on the intermediate zone of the disc.",
      "It consists of dense collagenous connective tissue that, in the central area, is avascular, hyalinized and devoid of nerves — but has vessels and nerves in the peripheral area.",
      "During movement the disc is somewhat flexible and can adapt to functional demands, but flexibility and adaptability do not imply that the morphology of the disc is reversibly altered during function.",
      "The superior head of the lateral pterygoid muscle inserts into the disc and capsule, attached to the anterior aspect of the disc by collagenous fibers. It helps stabilize the relationship of the disc to the eminence during mandibular opening.",
      "On the lateral side the disc is fused to the collateral ligament. All borders except the anterior are attached to capsular ligaments or synovial membranes separating the lower joint space from the upper joint space."
    ]},
    {h:"Retrodiscal tissue", callout:"The posterior attachment of the disc — a region of loose connective tissue that is highly vascularized and innervated.",
    table:{head:["Structure","Attachment","Fiber type"],rows:[
      ["Superior retrodiscal lamina","Attaches the articular disc posteriorly to the tympanic plate","Contains many elastic fibers — the posterior insertion must be elastic enough to allow anterior translatory movement with the condyle"],
      ["Inferior retrodiscal lamina","Attaches the inferior border of the posterior edge of the disc to the posterior margin of the articular surface of the condyle","Chiefly collagenous fibers, not elastic"],
      ["Body of retrodiscal tissue","Attached posteriorly to a large venous plexus","The plexus fills with blood as the condyle moves forward"]
    ]}},
    {h:"Ligaments — general", rules:[
      "Ligaments are made up of collagenous connective tissue that has a particular length.",
      "They do not stretch.",
      "They do not enter actively into joint function; they limit and restrict certain movements.",
      "They help stabilize the articular system during jaw movements.",
      "Three functional ligaments: collateral, capsular, and temporomandibular. Two accessory ligaments: stylomandibular and sphenomandibular."
    ]},
    {h:"Collateral (discal) ligament", rules:[
      "Attaches the medial and lateral borders of the articular disc to the poles of the condyle. There are two: the medial discal ligament and the lateral discal ligament.",
      "Functions to restrict movement of the disc away from the condyle, allowing the disc to move passively with the condyle as it glides anteriorly and posteriorly.",
      "Permits the disc to rotate anteriorly and posteriorly on the articular surface of the condyle, allowing the hinge movement of the TMJ, which occurs between the condyle and the articular disc.",
      "Along with the disc, it divides the joint into superior and inferior joint cavities. The superior cavity is bordered by the mandibular fossa and the superior surface of the disc; the inferior cavity is bordered by the mandibular condyle and the inferior surface of the disc."
    ]},
    {h:"Capsular ligament", rules:[
      "Surrounds and encloses the TMJ, retaining the synovial fluid.",
      "Consists of an internal synovial layer and an outer fibrous layer containing veins, nerves and collagen fibers.",
      "Resists any medial, lateral or inferior forces that tend to separate or dislocate the articular surfaces.",
      "Superior attachment — the temporal bone along the borders of the articular surfaces of the mandibular fossa and articular eminence. Inferior attachment — the neck of the condyle.",
      "Anterior attachment — the disc and the superior head of the lateral pterygoid muscle. Posterior attachment — blends with the bilaminar part of the disc, and includes the venous plexus attached to the posterior of the disc.",
