      "The anterolateral aspect of the capsule may thicken to form the temporomandibular ligament."
    ]},
    {h:"Temporomandibular ligament", callout:"Originates on the zygomatic arch and passes downward and obliquely to insert onto the lateral and distal surface of the neck of the condyle.",
    table:{head:["Portion","Course","Function"],rows:[
      ["Outer oblique portion","Outer surface of the zygomatic process posteroinferiorly to the condylar neck","Resists excessive dropping of the condyle. Initial hinge opening continues until the TM ligament becomes tight, preventing further rotation of the condylar neck; further opening is then brought about by the condyle gliding forward and downward across the articular eminence."],
      ["Inner horizontal portion","Outer surface of the zygomatic process posteriorly and horizontally to the lateral pole of the condyle and the posterior part of the articular disc","Limits posterior movement of the condyle and disc, prevents the condyle from moving into the posterior region of the mandibular fossa, protects the retrodiscal tissues from trauma, and protects the lateral pterygoid muscle from over-lengthening."]
    ]},
    rules:[
      "As the mouth opens, the teeth can separate about 20 to 25 mm without the condyles moving from the fossae. At that point the TM ligaments are fully extended, and further opening forces the condyles downward and forward out of the fossae, creating a second arc of opening.",
      "The change from hinge to gliding movement is brought about by the tightening of the TM ligament. This limitation of rotational opening is found only in humans."
    ]},
    {h:"Accessory ligaments", table:{head:["Ligament","Course","Function"],rows:[
      ["Stylomandibular","From the styloid process downward and forward to the angle and posterior border of the ramus of the mandible","Becomes tight when the mandible is protruded, limiting excessive protrusive movement"],
      ["Sphenomandibular","From the spine of the sphenoid bone and the petrotympanic fissure downward to the lingula of the mandible","Has no significant limiting effect on mandibular movement. Some fibers continue through the petrotympanic fissure via Huguier's canal to the middle ear, attaching to the malleus"],
      ["Otomandibular (two: discomalleolar and tympanomandibular)","Connect the middle ear and the TMJ","Connect the malleus to the articular disc and to the sphenomandibular ligament. The tympanomandibular ligament shares fibers with the sphenomandibular ligament"]
    ]}},
    {h:"Articulating surfaces", rules:[
      "The temporal bone is covered with fibrous tissue extending from the petrotympanic fissure to the glenoid fossa and anteriorly to the articular eminence, extending medially to the suture between the greater wing of the sphenoid and the squamous part of the temporal bone.",
      "The condyle is covered with fibrous tissue, posteriorly attached directly to bone but with an inner layer of fibrocartilage over the convexity. Such a layer is also interposed between the bone and the fibrous surface tissue of the articular eminence.",
      "The articular cartilage is composed of chondrocytes and intercellular matrix. Chondrocytes produce the matrix: collagen, proteoglycans, glycoproteins and enzymes."
    ],
    table:{head:["Zone (superficial to deep)","Description"],rows:[
      ["Articular","The most superficial layer, forming the outermost functional surface. Made up of dense fibrous connective tissue rather than hyaline cartilage, which makes up most synovial joints. Collagen fibers are arranged in bundles oriented nearly parallel to the articular surface, tightly packed and able to withstand the forces of movement. Advantages of fibrous connective tissue over hyaline cartilage: generally less susceptible to the effects of aging, so less likely to break down over time, and a much better ability to repair."],
      ["Proliferative","Responsible for the proliferation of the articular cartilage in response to the functional demands placed on the articular surfaces during loading."],
      ["Fibrocartilaginous","Appears in a random orientation, providing a three-dimensional network that offers resistance against compressive and lateral forces."],
      ["Calcified cartilage","The deepest layer. Made up of chondrocytes and chondroblasts distributed throughout the articular cartilage. The chondrocytes become hypertrophic, die, and have their cytoplasm evacuated, forming bone cells from within the medullary cavity."]
    ]}},
    {h:"Synovial tissues", rules:[
      "Both the upper and lower joint compartments are lined with synovial cells that fuse with the flat connective tissue cells covering the articulating surfaces. The TMJ is referred to as a synovial joint.",
      "Synovial fluid is a proteoglycan–hyaluronic acid complex that acts as a lubricant for the joint surfaces and participates in nutritional and metabolic interchange for the nonvascular, central parts of the joint. It is produced by specialized endothelial cells, columnar in shape, which surround the internal surfaces of the cavities.",
      "In nonpressure-bearing areas, especially the anterior border of the retrodiscal tissues, aggregations of synovial villa may be observed. Macrophages are also present in the joint spaces and participate in elimination of cellular debris and toxic products accrued during cell metabolism.",
      "Functional surfaces, which grossly appear smooth, have numerous pits and surface irregularities that facilitate lubrication during functional movements. Incongruence of the opposing joint surface also helps lubrication.",
      "Synovial fluid serves two purposes: it acts as a medium for providing metabolic requirements to nonvascular areas, and it serves as a lubricant between articulating surfaces."
    ],
    table:{head:["Mechanism","How it works","What it addresses"],rows:[
      ["Boundary lubrication","Occurs when the joint is moved and synovial fluid is forced from one area of the cavity into another","Prevents friction in the moving joint. This is the primary mechanism of joint lubrication"],
      ["Weeping lubrication","The articular surfaces absorb a small amount of synovial fluid; during function, forces drive a small amount of fluid in and out of the articular tissues","Eliminates friction in the compressed but not moving joint. This is the mechanism by which metabolic exchange occurs"]
    ]}},
    {h:"Biomechanics", table:{head:["System","Tissues","Movement"],rows:[
      ["System 1","The tissues surrounding the inferior synovial cavity — the condyle and the articular disc, together called the condyle-disc complex","Rotation"],
      ["System 2","The condyle-disc complex functioning against the surface of the mandibular fossa","Translation, occurring in the superior joint cavity"]
    ]},
    rules:[
      "The superior retrodiscal lamina is the only structure capable of retracting the disc posteriorly on the condyle.",
      "The superior lateral pterygoid muscle is a protractor of the disc. Protraction of the disc, however, does not occur during opening.",
      "The superior lateral pterygoid is activated only in conjunction with activity of the elevator muscles during mandibular closure or a power stroke.",
      "The mechanism by which the disc is maintained with the translating condyle depends on the morphology of the disc and the interarticular pressure.",
      "During the power stroke the superior lateral pterygoid becomes active, rotating the disc forward on the condyle so that the thicker posterior border maintains articular contact — joint stability is thereby maintained during the power stroke of chewing.",
      "Ligaments do not actively participate in normal TMJ function and do not stretch, and the articular surfaces of the TMJ must be maintained in constant contact."
    ]}
  ],
  traps:[
    ["Compound joint with only two bones","The definition of a compound joint requires three bones. The TMJ has two, and the articular disc functions as a nonossified bone to satisfy the classification."],
    ["Superior vs. inferior retrodiscal lamina","Superior attaches the disc to the tympanic plate and is rich in elastic fibers. Inferior attaches the disc to the condyle and is chiefly collagenous. Only the superior lamina can retract the disc."],
    ["Rotation vs. translation cavities","Rotation happens in the inferior joint cavity, between the condyle and the disc. Translation happens in the superior joint cavity, between the condyle-disc complex and the fossa."],
    ["Boundary vs. weeping lubrication","Boundary handles the moving joint and is the primary mechanism. Weeping handles the compressed but stationary joint and is how metabolic exchange occurs."],
    ["Which TM ligament portion does what","Outer oblique limits how far the condyle can drop and forces the switch from rotation to gliding. Inner horizontal limits posterior movement and protects the retrodiscal tissues."],
    ["Superior lateral pterygoid timing","It fires during closure and the power stroke — not during opening."]
  ],
  questions:[
    {q:"The TMJ is described as a ginglymoarthrodial joint because it provides:",o:["Rotation only","Translation only","Both rotation (hinging) and translation (gliding)","Rotation in three planes"],a:2,e:"Ginglymoid refers to hinging or rotation; arthrodial refers to gliding or translation. The TMJ does both."},
    {q:"Why is the TMJ classified as a compound joint despite having only two bones?",o:["Because the capsule counts as a third structure","Because the articular disc functions as a nonossified bone","Because the temporal bone contributes two articulating surfaces","Because it has two synovial cavities"],a:1,e:"The definition of a compound joint requires three bones. Functionally the articular disc serves as a nonossified bone permitting the complex movements of the joint."},
    {q:"Which nerve provides the majority of the innervation to the TMJ?",o:["Masseteric nerve","Deep temporal nerve","Auriculotemporal nerve","Facial nerve"],a:2,e:"The auriculotemporal nerve, a branch of the trigeminal, provides the majority. The deep temporal and masseteric nerves also contribute. The same nerve supplies motor and sensory innervation to the muscles controlling the joint."},
    {q:"The anterior convex portion of the articular surface of the temporal bone is the:",o:["Mandibular fossa","Articular eminence","Postglenoid tubercle","Tympanic plate"],a:1,e:"The articular eminence is the anterior convex portion; the mandibular fossa is the posterior concave portion."},
    {q:"Which structure forms the posterior, nonarticulating border of the mandibular fossa?",o:["The articular eminence","The middle root of the zygoma","The tympanic plate of the petrous portion of the temporal bone","The postglenoid tubercle"],a:2,e:"The tympanic plate of the petrous portion of the temporal bone forms the posterior border and is the nonarticulating portion of the fossa."},
    {q:"The two bony lips limiting condylar displacement are the postglenoid tubercle and the:",o:["Medial glenoid lip","Articular eminence","Lingula","Styloid process"],a:0,e:"Postglenoid tubercle laterally, medial glenoid lip medially. Together they limit condylar displacement distally, laterally and vertically."},
    {q:"The mandibular condyle is described as:",o:["Wider anteroposteriorly than lateromedially","Wider lateromedially than anteroposteriorly","Concave on its superior bearing surface","Parallel to the ascending ramus"],a:1,e:"Knoblike, a modified barrel shape, wider lateromedially than anteroposteriorly. It is convex on all bearing surfaces and perpendicular to the ascending ramus."},
    {q:"A line drawn through the long axes of both condyles would meet at a point:",o:["At the foramen magnum","Anterior to the foramen magnum","Posterior to the foramen magnum","At the midline of the hard palate"],a:1,e:"The long axes are in a lateral plane but not on the same plane; the line drawn through them meets anterior to the foramen magnum."},
    {q:"In the sagittal plane, which region of the articular disc is thinnest?",o:["Anterior band","Posterior band","Intermediate (central) zone","Medial portion"],a:2,e:"The central zone is about 1 mm while the anterior and posterior bands are 2–3 mm. The posterior band is generally slightly thicker than the anterior band."},
    {q:"The articular surface of the condyle is located on which portion of the disc?",o:["The posterior band","The anterior band","The intermediate zone","The lateral portion"],a:2,e:"The condyle articulates on the intermediate zone, which is the thin central region of the disc."},
    {q:"In the coronal plane, which portion of the articular disc is generally thicker?",o:["Lateral","Medial","Central","They are equal"],a:1,e:"The medial portion is generally thicker, corresponding to the increased space between the condyle and the articular fossa toward the medial of the joint."},
    {q:"The central area of the articular disc is:",o:["Highly vascularized and innervated","Avascular, hyalinized and devoid of nerves","Composed of hyaline cartilage","Attached to the superior lateral pterygoid"],a:1,e:"The central area is avascular, hyalinized and devoid of nerves, while the peripheral area has vessels and nerves. The highly vascularized and innervated region is the retrodiscal tissue."},
    {q:"Which structure attaches the articular disc posteriorly to the tympanic plate and contains many elastic fibers?",o:["Inferior retrodiscal lamina","Superior retrodiscal lamina","Collateral ligament","Capsular ligament"],a:1,e:"The superior retrodiscal lamina. Its elasticity allows the anterior translatory movement of the disc with the condyle."},
    {q:"The inferior retrodiscal lamina is composed chiefly of:",o:["Elastic fibers","Collagenous fibers","Hyaline cartilage","Fibrocartilage"],a:1,e:"Chiefly collagenous fibers, not elastic. It attaches the inferior border of the posterior edge of the disc to the posterior margin of the articular surface of the condyle."},
    {q:"Which is NOT true of TMJ ligaments?",o:["They are made of collagenous connective tissue","They do not stretch","They actively participate in normal joint function","They limit and restrict certain movements"],a:2,e:"Ligaments do not enter actively into joint function. They limit and restrict movements and help stabilize the articular system."},
    {q:"The collateral ligament attaches the:",o:["Zygomatic arch to the condylar neck","Medial and lateral borders of the disc to the poles of the condyle","Styloid process to the ramus","Sphenoid spine to the lingula"],a:1,e:"Also called the discal ligament, with medial and lateral components. It restricts movement of the disc away from the condyle while allowing the disc to rotate on the condyle."},
    {q:"The hinge movement of the TMJ occurs between which two structures?",o:["The condyle and the mandibular fossa","The disc and the articular eminence","The condyle and the articular disc","The disc and the tympanic plate"],a:2,e:"The collateral ligaments permit the disc to rotate anteriorly and posteriorly on the articular surface of the condyle, so hinging occurs between condyle and disc — in the inferior joint cavity."},
    {q:"The superior joint cavity is bordered by:",o:["The condyle and the inferior surface of the disc","The mandibular fossa and the superior surface of the disc","The articular eminence and the condylar neck","The capsule and the retrodiscal tissue"],a:1,e:"Superior cavity: mandibular fossa above, superior surface of the disc below. Inferior cavity: mandibular condyle below, inferior surface of the disc above."},
    {q:"Which ligament resists medial, lateral or inferior forces that tend to separate or dislocate the articular surfaces?",o:["Temporomandibular ligament","Capsular ligament","Stylomandibular ligament","Sphenomandibular ligament"],a:1,e:"The capsular ligament surrounds and encloses the joint, retains the synovial fluid, and resists these separating forces."},
    {q:"The outer oblique portion of the temporomandibular ligament primarily:",o:["Limits posterior movement of the condyle","Resists excessive dropping of the condyle and limits rotational opening","Limits protrusive movement","Protects the lateral pterygoid from over-lengthening"],a:1,e:"The outer oblique portion resists excessive dropping of the condyle. Once it tightens, hinge opening stops and the condyle must glide forward and downward across the eminence."},
    {q:"Approximately how far can the teeth separate before the condyles must move from the fossae?",o:["5 to 10 mm","10 to 15 mm","20 to 25 mm","35 to 40 mm"],a:2,e:"About 20 to 25 mm. At that point the TM ligaments are fully extended and further opening creates a second arc as the condyles move downward and forward."},
    {q:"The limitation of rotational opening by the TM ligament is a feature found in:",o:["All mammals","All primates","Humans only","Carnivores only"],a:2,e:"The lecture notes that this unique feature — the limitation of rotational opening — is found only in humans."},
    {q:"Which ligament becomes tight when the mandible is protruded?",o:["Sphenomandibular","Stylomandibular","Collateral","Capsular"],a:1,e:"The stylomandibular ligament limits excessive protrusive movement of the mandible."},
    {q:"Fibers of which ligament pass through the petrotympanic fissure to attach to the malleus?",o:["Stylomandibular","Sphenomandibular","Temporomandibular","Collateral"],a:1,e:"A continuation of some sphenomandibular fibers passes through the petrotympanic fissure via Huguier's canal to the middle ear and attaches to the malleus. The sphenomandibular has no significant limiting effect on mandibular movement."},
    {q:"The articular zone of the TMJ articulating surface is composed of:",o:["Hyaline cartilage","Dense fibrous connective tissue","Calcified cartilage","Elastic cartilage"],a:1,e:"Dense fibrous connective tissue rather than hyaline cartilage, which makes up most synovial joints. It is less susceptible to aging and has a much better ability to repair."},
    {q:"Which zone of the articulating surface is responsible for proliferation of articular cartilage in response to loading?",o:["Articular","Proliferative","Fibrocartilaginous","Calcified"],a:1,e:"The proliferative zone responds to the functional demands placed on the articular surfaces during loading."},
    {q:"In which zone do chondrocytes become hypertrophic, die, and have their cytoplasm evacuated, forming bone cells?",o:["Articular","Proliferative","Fibrocartilaginous","Calcified cartilage"],a:3,e:"The calcified cartilage zone is the deepest layer, made of chondrocytes and chondroblasts, and is where this process forms bone cells from within the medullary cavity."},
    {q:"Which zone provides a three-dimensional network resisting compressive and lateral forces through randomly oriented fibers?",o:["Articular","Proliferative","Fibrocartilaginous","Calcified"],a:2,e:"The fibrocartilaginous zone appears in a random orientation for exactly this purpose. By contrast, the articular zone's collagen bundles are oriented nearly parallel to the surface."},
    {q:"Synovial fluid is chemically described as a:",o:["Proteoglycan–hyaluronic acid complex","Glycoprotein–collagen complex","Lipid–protein emulsion","Simple ultrafiltrate of plasma"],a:0,e:"It acts as a lubricant and participates in nutritional and metabolic interchange for the nonvascular central parts of the joint."},
    {q:"Which is the primary mechanism of joint lubrication in the TMJ?",o:["Weeping lubrication","Boundary lubrication","Hydrostatic lubrication","Elastohydrodynamic lubrication"],a:1,e:"Boundary lubrication occurs when the joint moves and synovial fluid is forced from one area of the cavity into another. It prevents friction in the moving joint and is the primary mechanism."},
    {q:"Weeping lubrication is the mechanism that:",o:["Prevents friction in the moving joint","Eliminates friction in the compressed but not moving joint","Retracts the disc posteriorly","Produces synovial fluid"],a:1,e:"Weeping lubrication refers to the articular surfaces absorbing a small amount of synovial fluid. It eliminates friction in the compressed but stationary joint and is how metabolic exchange occurs."},
    {q:"The condyle-disc complex is responsible for which movement?",o:["Translation","Rotation","Protrusion only","Lateral excursion only"],a:1,e:"System 1, the tissues surrounding the inferior synovial cavity, is the condyle-disc complex and is responsible for rotation. Translation occurs in the superior joint cavity."},
    {q:"Which structure is the only one capable of retracting the disc posteriorly on the condyle?",o:["Superior lateral pterygoid","Inferior retrodiscal lamina","Superior retrodiscal lamina","Inner horizontal portion of the TM ligament"],a:2,e:"The superior retrodiscal lamina alone can retract the disc posteriorly. The superior lateral pterygoid is a protractor of the disc."},
    {q:"The superior lateral pterygoid muscle is activated:",o:["During mandibular opening","Only in conjunction with elevator muscle activity during closure or the power stroke","Continuously during all mandibular movement","Only during protrusion"],a:1,e:"Protraction of the disc does not occur during opening. During the power stroke it rotates the disc forward so the thicker posterior border maintains articular contact, preserving joint stability."},
    {q:"What maintains the disc with the translating condyle?",o:["The collateral ligaments alone","The morphology of the disc and the interarticular pressure","The capsular ligament and synovial fluid pressure","The inferior retrodiscal lamina"],a:1,e:"The mechanism depends on the morphology of the disc and the interarticular pressure."},
    {q:"What are the three main sections of the retrodiscal tissues?",o:["Superior lamina, intermediate zone, inferior lamina","Superior retrodiscal tissues, venous plexus, inferior retrodiscal tissues","Articular, proliferative, fibrocartilaginous","Anterior band, central zone, posterior band"],a:1,e:"Superior retrodiscal tissues, the venous plexus, and the inferior retrodiscal tissues. The venous plexus fills with blood as the condyle translates forward."},
    {q:"Movement from initial opening to about the midpoint of opening occurs in which compartment?",o:["Upper (superior) compartment","Lower (inferior) compartment","Both equally","Neither — it occurs in the capsule"],a:1,e:"Initial opening is rotation, which occurs in the lower compartment between the condyle and the disc. From the midpoint to maximum opening, translation occurs in the upper compartment."},
    {q:"Movement from the midpoint of opening to maximum opening occurs in which compartment, and by what motion?",o:["Lower compartment, rotation","Upper compartment, translation","Upper compartment, rotation","Lower compartment, translation"],a:1,e:"Upper compartment, translation or gliding. The switch from rotation to gliding is triggered by tightening of the outer oblique portion of the TM ligament."},
    {q:"In which zone of the articular disc are forces applied?",o:["Anterior band","Posterior band","Intermediate (middle) zone","Medial portion"],a:2,e:"The intermediate or middle zone is where the condyle articulates and where loading forces are applied — which is also why it is the thinnest region at about 1 mm."},
    {q:"Where in the TMJ are elastic fibers found?",o:["The inferior retrodiscal lamina","The superior retrodiscal tissues","The collateral ligament","The capsular ligament"],a:1,e:"The superior retrodiscal lamina contains many elastic fibers, allowing the disc to be retracted posteriorly and to accommodate anterior translation of the condyle."}
  ]
},
{
  id:"numbering", code:"05", title:"Tooth Numbering Systems",
  short:"Numbering",
  source:"Single lecture",
  blurb:"The three reference systems: Universal, Palmer notation, and International (FDI). Use the interactive chart below to drill any tooth in any system.",
  odontogram:true,
  sections:[
    {h:"Why numbering systems exist", rules:[
      "In dentistry, numbering systems serve as abbreviations. Instead of writing out the entire name of the tooth, it is simpler to assign it a number, letter or symbol.",
      "Three systems: Universal, Palmer Notation (symbolic), and International (FDI)."
    ]},
    {h:"Universal Numbering System", callout:"The numbering system most commonly used in the United States.",
    table:{head:["Dentition","Range","Starts at","Ends at"],rows:[
      ["Permanent","1–32","1 = maxillary right third molar","32 = mandibular right third molar"],
      ["Deciduous (primary)","A–T","A = maxillary right second molar","T = mandibular right second molar"]
    ]},
    rules:[
      "Permanent numbering runs 1–16 across the maxillary arch from the patient's right to left, then 17–32 across the mandibular arch from the patient's left to right.",
      "Examples: 3 = permanent maxillary right first molar; 20 = permanent mandibular left second premolar.",
      "Deciduous lettering runs A–J across the maxillary arch from the patient's right to left, then K–T across the mandibular arch from the patient's left to right.",
      "Examples: A = deciduous maxillary right second molar; M = deciduous mandibular left canine."
    ]},
    {h:"Palmer Notation (symbolic)", rules:[
      "A quadrant symbol combined with a number or a letter.",
      "Permanent teeth are numbered 1–8 in each quadrant, counting from the midline outward: 1 = central incisor through 8 = third molar.",
      "Deciduous teeth are lettered A–E in each quadrant, counting from the midline outward: A = central incisor through E = second molar.",
      "The bracket symbol indicates which quadrant, opening away from the midline and the occlusal plane.",
      "Examples: 5 in the upper right bracket = permanent maxillary right second premolar; C in the lower right bracket = deciduous mandibular right canine."
    ]},
    {h:"International (FDI) System", callout:"A simple binomial system that includes both permanent and deciduous teeth. First digit = quadrant and dentition. Second digit = tooth.",
    table:{head:["First digit","Quadrant"],rows:[
      ["1","Permanent maxillary right"],["2","Permanent maxillary left"],
      ["3","Permanent mandibular left"],["4","Permanent mandibular right"],
      ["5","Deciduous maxillary right"],["6","Deciduous maxillary left"],
      ["7","Deciduous mandibular left"],["8","Deciduous mandibular right"]
    ]},
    rules:[
      "Second digit, permanent: 1 central incisor, 2 lateral incisor, 3 canine, 4 first premolar, 5 second premolar, 6 first molar, 7 second molar, 8 third molar.",
      "Second digit, deciduous: 1 central incisor, 2 lateral incisor, 3 canine, 4 first molar, 5 second molar.",
      "When pronouncing FDI numbers, say each individual digit. Right permanent maxillary central incisor 11 is 'one, one'; left permanent mandibular first molar 36 is 'three, six'; right primary maxillary canine 53 is 'five, three'; left primary mandibular second molar 75 is 'seven, five'.",
      "When writing, you may sometimes see a dot placed after each number — 1.1., 3.6., 5.3., 7.5. — but usually that is not the case."
    ]}
  ],
  traps:[
    ["Universal jumps arches at 16/17 and J/K","Permanent 16 is the maxillary left third molar and 17 is the mandibular left third molar — the sequence drops straight down and reverses direction. Same for J to K in the primary dentition."],
    ["FDI quadrants 5–8 are primary","Quadrants 1–4 are permanent and 5–8 are deciduous, and both sets run in the same clockwise order starting maxillary right."],
    ["FDI counts from the midline, Universal does not","In FDI the second digit always counts outward from the midline, so 11, 21, 31 and 41 are all central incisors. Universal counts continuously around the arch."],
    ["Primary teeth have no premolars","In FDI, the primary second digit 4 is the first molar and 5 is the second molar — not premolars."]
  ],
  questions:[
    {q:"In the Universal system, tooth #3 is the:",o:["Permanent maxillary right second premolar","Permanent maxillary right first molar","Permanent maxillary left first molar","Permanent maxillary right canine"],a:1,e:"Counting from 1 = maxillary right third molar: 1 third molar, 2 second molar, 3 first molar."},
    {q:"In the Universal system, tooth #20 is the:",o:["Permanent mandibular left first molar","Permanent mandibular left second premolar","Permanent mandibular right second premolar","Permanent mandibular left first premolar"],a:1,e:"17 = mandibular left third molar, 18 second molar, 19 first molar, 20 second premolar."},
    {q:"In the Universal system, letter A designates the:",o:["Deciduous maxillary right central incisor","Deciduous maxillary right second molar","Deciduous maxillary left second molar","Deciduous mandibular right second molar"],a:1,e:"Lettering begins at the patient's maxillary right second molar and runs across to J at the maxillary left second molar."},
    {q:"In the Universal system, letter M designates the:",o:["Deciduous mandibular left canine","Deciduous mandibular right canine","Deciduous maxillary left canine","Deciduous mandibular left first molar"],a:0,e:"K = mandibular left second molar, L = mandibular left first molar, M = mandibular left canine."},
    {q:"Which Universal number identifies the permanent mandibular right central incisor?",o:["#24","#25","#8","#9"],a:1,e:"Mandibular numbering runs 17 at the left third molar around to 32 at the right third molar, making 24 the mandibular left central and 25 the mandibular right central."},
    {q:"In the FDI system, which quadrant number designates the permanent mandibular left quadrant?",o:["2","3","4","7"],a:1,e:"1 permanent maxillary right, 2 permanent maxillary left, 3 permanent mandibular left, 4 permanent mandibular right."},
    {q:"FDI tooth 46 is the:",o:["Permanent mandibular right first molar","Permanent mandibular left first molar","Permanent maxillary right first molar","Deciduous mandibular right first molar"],a:0,e:"First digit 4 is the permanent mandibular right quadrant; second digit 6 is the first molar."},
    {q:"FDI tooth 63 is the:",o:["Permanent maxillary left canine","Deciduous maxillary left canine","Deciduous mandibular left canine","Deciduous maxillary right canine"],a:1,e:"First digit 6 is the deciduous maxillary left quadrant; second digit 3 is the canine."},
    {q:"In the FDI system, the second digit 5 in a primary tooth designates the:",o:["Second premolar","First molar","Second molar","Canine"],a:2,e:"Primary teeth have no premolars, so the primary second digits run 1 central incisor, 2 lateral incisor, 3 canine, 4 first molar, 5 second molar."},
    {q:"FDI 75 should be pronounced and identified as:",o:["'Seventy-five,' the permanent mandibular left second premolar","'Seven, five,' the deciduous mandibular left second molar","'Seven, five,' the deciduous mandibular right second molar","'Seventy-five,' the deciduous maxillary left second molar"],a:1,e:"Each digit is said individually. Quadrant 7 is the deciduous mandibular left, and primary second digit 5 is the second molar."},
    {q:"In Palmer notation, permanent teeth are numbered 1 through 8 beginning at the:",o:["Third molar and counting toward the midline","Midline and counting distally","Canine and counting in both directions","First molar and counting mesially"],a:1,e:"Palmer counts outward from the midline: 1 central incisor through 8 third molar. Deciduous teeth use A through E the same way."},
    {q:"A tooth charted in Palmer notation as the letter C in the lower right quadrant symbol is the:",o:["Permanent mandibular right canine","Deciduous mandibular right canine","Deciduous mandibular right first molar","Deciduous maxillary right canine"],a:1,e:"Letters indicate the deciduous dentition, and C is the third tooth from the midline — the canine."},
    {q:"Which system is a binomial system that includes both permanent and deciduous teeth using two digits?",o:["Universal","Palmer notation","International (FDI)","All three"],a:2,e:"FDI uses one digit for quadrant and dentition and one for the tooth, covering both dentitions in a single scheme."},
    {q:"Which numbering system is most commonly used in the United States?",o:["Universal","Palmer notation","FDI","ISO 3950"],a:0,e:"The Universal system is the one most commonly used in the United States."},
    {q:"An 11-year-old presents with a mixed dentition. The clinician charts tooth 'K'. Which system is in use and which tooth is it?",o:["Universal; deciduous mandibular left second molar","FDI; permanent mandibular left canine","Palmer; deciduous maxillary left second molar","Universal; deciduous maxillary left second molar"],a:0,e:"Letters used alone without a quadrant bracket indicate the Universal system, where K is the deciduous mandibular left second molar — the first of the mandibular letters."},
    {q:"Which Universal numbers correspond to the four permanent first molars?",o:["1, 16, 17, 32","3, 14, 19, 30","2, 15, 18, 31","4, 13, 20, 29"],a:1,e:"Counting in from each third molar: maxillary right 3, maxillary left 14, mandibular left 19, mandibular right 30. These four are the cornerstones of permanent occlusion."}
  ]
},
{
  id:"develop", code:"06", title:"Development of the Teeth",
  short:"Development",
  source:"Single lecture",
  blurb:"From dental lamina through bud, cap and bell stages to root formation, eruption, resorption and exfoliation — plus the anomalies that interrupt the sequence.",
  sections:[
    {h:"Development of the dental organ", callout:"As early as the second month of fetal life, the development of the deciduous teeth may first become evident.",
    table:{head:["Stage","What happens"],rows:[
      ["Dental lamina","An epithelial thickening occurring in the region where teeth will form, at about six weeks of prenatal life."],
      ["Bud stage","Shortly after the dental lamina differentiates, twenty tooth buds begin to appear on the dental lamina in the approximate location of the twenty primary teeth. The individual buds are somewhat round or ovoid."],
      ["Cap stage","The generally round form of the bud is altered as the basal portion invaginates, giving the appearance of a cap."],
      ["Bell stage","The concavity on the basal area of the cap continues to deepen. As this stage nears completion, the form of the crown can be recognized and the dentinoenamel junction is identifiable. Most of the crown's dentin and enamel is laid down during this time. During the latter portion of the bell stage the dental lamina connection with the deciduous tooth begins to break down and eventually disintegrates — and as it disappears, the bud of the succedaneous tooth is forming from it."],
      ["Root development","When enamel and dentin deposition have formed the area of the cementoenamel junction, the bell is regarded as ending and root development begins. The enamel organ proliferates Hertwig's sheath (the epithelial root sheath), from which the root structure is formed. The dentin and the cementum of the root are then deposited."]
    ]}},
    {h:"Enamel knot", rules:[
      "The enamel knot is a reservoir of signaling pathway-related genes and signaling molecules that allow tooth morphogenesis to progress toward the bell stage and regulate the tooth's shape.",
      "It is located in the center of bud and cap stage tooth germs and is a transitory cluster of non-dividing epithelial cells.",
      "It acts as a signaling center providing positional information for tooth morphogenesis, and regulates the growth of tooth cusps by inducing secondary enamel knots.",
      "The primary enamel knot forms in both incisor and molar tooth germs at the cap stage.",
      "Secondary and tertiary enamel knots develop only in molar tooth germs, sitting at the sites of future cusp tips from the early bell stage."
    ]},
    {h:"Eruption", rules:[
      "Prior to the complete calcification of its root, the tooth normally begins eruption by pushing through the mucous membrane cover of the alveolar process and into the oral cavity.",
      "The eruption process is considered complete when the tooth contacts its opponent(s) in the opposite jaw member."
    ],
    defs:[
      ["Active eruption","The process from the tooth's entry into the oral cavity to its contact with an antagonist in the opposing arch."],
      ["Passive eruption","The continuing process of adaptation of the tooth to changing incisal and occlusal relationships after active eruption has ended. This adjustment to attritional wear and changing locations of adjacent and opposing teeth continues throughout the life of the tooth."],
      ["Supraeruption","When a tooth erupts past the normal occlusal plane, usually due to the loss of its antagonist tooth or teeth from the opposing arch."],
      ["Nasmyth's membrane","A keratinous, membrane-like enamel cuticle that envelopes the anatomical crown when the tooth erupts. It is soon abraded away over most of its extent."]
    ]},
    {h:"Root completion", rules:[
      "The root apex is funnel shaped shortly after eruption.",
      "Root formation is not complete until additional dentin deposition reduces the funnel shaped opening to a constricted foramen.",
      "At age 3, root formation has ended for all deciduous teeth.",
      "The time lag between eruption and root completion for the deciduous teeth is about one year.",
      "For the permanent teeth, the time lag between eruption and root completion is about three years."
    ]},
    {h:"Position of developing permanent teeth", rules:[
      "The time when the tooth bud first differentiates from the dental lamina is always prior to the initiation of calcification.",
      "The permanent incisor and canine buds are found just lingual to the roots of their deciduous predecessors.",
      "The premolar buds are located in the root furcation of the deciduous molars.",
      "The permanent molars are not succedaneous teeth. Their buds develop from the dental lamina in the alveolar process distal to the deciduous dentition."
    ]},
    {h:"Late deciduous stage and the permanent first molars", rules:[
      "By approximately five years of age, growth of the mandible and maxilla has created more space for the permanent teeth soon to erupt.",
      "This extra space often results in diastemas — spaces between adjacent teeth — usually in the anterior segment of the arches. Another suggested cause is pressure exerted from the lingual by the developing permanent anterior teeth.",
      "The greater space in the arches also allows room for the entry of the first molars distal to the deciduous dentition.",
      "The mandibular first molar is normally the first permanent tooth to emerge, at about age six, thus ending the deciduous dentition stage and initiating the mixed dentition stage. The maxillary first molars follow shortly thereafter.",
      "The four first molars are considered to be the cornerstones in the development of occlusion of the permanent dentition."
    ]},
    {h:"Resorption and exfoliation", rules:[
      "Shortly after the permanent first molars appear, the permanent mandibular central incisors are scheduled to erupt. Before this can occur the deciduous predecessors must be shed, or exfoliated.",
      "Generally, resorption begins at the apex and moves toward the cervical line.",
      "The reason for the initiation and progression of resorption is ascribed to pressure from the permanent tooth crown against the deciduous root. The actual process is due to osteoclastic activity.",
      "The resorption phase normally begins at least a year prior to exfoliation. The period between completion of the root for the second deciduous molars, at about 3 years of age, and the initiation of resorption for some deciduous incisors, before age 5, is less than two years.",
      "Exfoliation usually occurs symmetrically, with the same teeth of the right and left sides being lost at about the same time.",
      "Mandibular teeth generally precede the same maxillary teeth in exfoliation — with the exception of the second molars, where all four are usually lost simultaneously.",
      "The same series of events occurs for all the deciduous teeth over a range of approximately six years. The mixed dentition period ends with the exfoliation of the deciduous second molars at about age 12."
    ]},
    {h:"When the sequence fails", defs:[
      ["Incomplete resorption","Occasionally root resorption is only partial and the deciduous tooth does not exfoliate. The permanent tooth must then erupt in an abnormal position, or be entirely blocked from entry. The practitioner must diagnose it and perform the customary treatment — extraction of the offending deciduous tooth."],
      ["Ankylosis","Occasionally the root surface of the deciduous tooth becomes 'fused' to the surrounding alveolar bone. Further eruption ceases, the tooth becomes fixed in position, and resorption cannot progress naturally. It occurs most often with the deciduous molars. An ankylosed tooth precludes proper eruption of the succedaneous tooth and must be surgically removed as soon as it is diagnosed."]
    ]}
  ],
  traps:[
    ["Bell stage ends at the CEJ","Root development begins when enamel and dentin deposition have formed the area of the cementoenamel junction. That is the boundary between bell stage and root development."],
    ["Secondary enamel knots are molars only","The primary enamel knot forms in both incisor and molar germs at the cap stage. Secondary and tertiary knots develop only in molar germs, at future cusp tip sites, from the early bell stage."],
    ["Resorption starts at the apex","Not at the cervical line. It begins apically and moves toward the cervical line, driven by osteoclastic activity, with pressure from the permanent crown as the ascribed cause."],
    ["Premolar buds sit in the furcation","Incisor and canine buds sit lingual to the deciduous roots. Premolar buds sit in the root furcation of the deciduous molars. Permanent molars form distal to the deciduous dentition and are not succedaneous."],
    ["Second molars are the exfoliation exception","Mandibular teeth generally exfoliate before their maxillary counterparts — except the second molars, where all four are usually lost simultaneously."]
  ],
  questions:[
    {q:"The dental lamina appears at approximately what point in prenatal life?",o:["Two weeks","Six weeks","Three months","Six months"],a:1,e:"The dental lamina is an epithelial thickening in the region where teeth will form, occurring at about six weeks of prenatal life. Development of the deciduous teeth may first become evident as early as the second month of fetal life."},
    {q:"How many tooth buds appear on the dental lamina during the bud stage?",o:["Ten","Twenty","Thirty-two","Fifty-two"],a:1,e:"Twenty tooth buds appear in the approximate location of the twenty primary teeth."},
    {q:"During which stage is the dentinoenamel junction first identifiable and most of the crown's dentin and enamel laid down?",o:["Bud stage","Cap stage","Bell stage","Root development stage"],a:2,e:"As the bell stage nears completion, the form of the crown can be recognized and the DEJ is identifiable."},
    {q:"The bud of the succedaneous tooth forms from which structure, and when?",o:["Hertwig's sheath, during root development","The dental lamina, as its connection with the deciduous tooth disintegrates in the late bell stage","The enamel knot, at the cap stage","The alveolar process, after eruption"],a:1,e:"During the latter portion of the bell stage the dental lamina connection with the deciduous tooth breaks down, and as it disappears the succedaneous tooth bud forms from it."},
    {q:"Root development is considered to begin when:",o:["The tooth erupts into the oral cavity","Enamel and dentin deposition have formed the area of the cementoenamel junction","The apical foramen constricts","The enamel knot disappears"],a:1,e:"That point marks the end of the bell stage and the beginning of root development, when the enamel organ proliferates Hertwig's sheath."},
    {q:"Hertwig's sheath is:",o:["The keratinous cuticle covering the newly erupted crown","The epithelial root sheath proliferated by the enamel organ","A cluster of non-dividing epithelial cells at the cap stage","The membrane lining the alveolus"],a:1,e:"Also called the epithelial root sheath, it is proliferated by the enamel organ and the root structure is formed from it. The keratinous cuticle over an erupted crown is Nasmyth's membrane."},
    {q:"Which statement about enamel knots is correct?",o:["Primary knots form only in molar germs","Secondary and tertiary knots develop only in molar germs","Enamel knots are permanent structures of the tooth germ","Enamel knots first appear at the bell stage"],a:1,e:"The primary enamel knot forms in both incisor and molar germs at the cap stage. Secondary and tertiary knots are molar-only and sit at future cusp tip sites from the early bell stage."},
    {q:"The enamel knot is best described as a:",o:["Permanent mineralized nodule","Transitory cluster of non-dividing epithelial cells acting as a signaling center","Region of rapidly dividing mesenchymal cells","Vascular plexus supplying the tooth germ"],a:1,e:"It provides positional information for tooth morphogenesis and regulates the growth of cusps by inducing secondary enamel knots."},
    {q:"Eruption is considered complete when:",o:["The crown fully clears the mucous membrane","The root apex closes","The tooth contacts its opponent in the opposite jaw","The tooth reaches the occlusal plane of the adjacent teeth"],a:2,e:"The process is complete when the tooth contacts its opponent or opponents in the opposite jaw member. Note that eruption normally begins before the root has completely calcified."},
    {q:"A patient loses a mandibular first molar and over several years the opposing maxillary first molar erupts past the occlusal plane. This is called:",o:["Active eruption","Passive eruption","Supraeruption","Ankylosis"],a:2,e:"Supraeruption occurs when a tooth erupts past the normal occlusal plane, usually due to loss of its antagonist."},
    {q:"Passive eruption refers to:",o:["Eruption that occurs without root formation","Continuing adaptation to changing incisal and occlusal relationships after active eruption has ended","The movement of a tooth into the space of an extracted neighbor","Eruption of a tooth that has no succedaneous predecessor"],a:1,e:"It is the adjustment to attritional wear and to changing locations of adjacent and opposing teeth, and it continues throughout the life of the tooth."},
    {q:"Nasmyth's membrane is:",o:["The epithelial root sheath","A keratinous enamel cuticle enveloping the anatomical crown at eruption","The lining of the gingival sulcus","The periodontal ligament attachment at the CEJ"],a:1,e:"It envelops the anatomical crown when the tooth erupts and is soon abraded away over most of its extent."},
    {q:"At what age has root formation ended for all deciduous teeth?",o:["Age 1","Age 3","Age 5","Age 6"],a:1,e:"At age 3. The time lag between eruption and root completion for the deciduous teeth is about one year."},
    {q:"Where are the developing permanent premolar buds located?",o:["Just lingual to the deciduous molar roots","In the root furcation of the deciduous molars","Distal to the deciduous second molars","Just facial to the deciduous canine roots"],a:1,e:"Premolar buds sit in the furcation. Incisor and canine buds are just lingual to the roots of their deciduous predecessors."},
    {q:"Which permanent teeth are NOT succedaneous?",o:["The premolars","The canines","The molars","The lateral incisors"],a:2,e:"The permanent molars do not replace deciduous teeth. Their buds develop from the dental lamina in the alveolar process distal to the deciduous dentition."},
    {q:"Which tooth is normally the first permanent tooth to emerge?",o:["Maxillary first molar","Mandibular first molar","Mandibular central incisor","Maxillary central incisor"],a:1,e:"The mandibular first molar emerges at about age six, ending the deciduous dentition stage and initiating the mixed dentition stage."},
    {q:"The four permanent first molars are described as:",o:["The last teeth to complete root formation","The cornerstones in the development of occlusion of the permanent dentition","The most commonly congenitally missing teeth","The only teeth with three roots"],a:1,e:"They are considered the cornerstones in the development of occlusion of the permanent dentition."},
    {q:"Diastemas appearing in the anterior segment at about age five are attributed to:",o:["Premature loss of deciduous canines","Jaw growth creating space, and pressure from the lingual by developing permanent anterior teeth","Ankylosis of the deciduous incisors","Incomplete resorption"],a:1,e:"Growth of the mandible and maxilla creates more space for the permanent teeth. Pressure from the lingual by the developing permanent anteriors is another suggested cause."},
    {q:"Resorption of a deciduous root generally begins:",o:["At the cervical line and moves apically","At the apex and moves toward the cervical line","At the furcation and moves outward","Simultaneously along the entire root surface"],a:1,e:"Resorption begins at the apex and moves toward the cervical line."},
    {q:"The actual cellular process of deciduous root resorption is due to:",o:["Odontoblastic activity","Osteoclastic activity","Ameloblastic activity","Fibroblastic activity"],a:1,e:"Osteoclastic activity carries out resorption; pressure from the permanent tooth crown against the deciduous root is the ascribed cause of its initiation and progression."},
    {q:"How long before exfoliation does the resorption phase normally begin?",o:["At least a month","At least six months","At least a year","At least three years"],a:2,e:"The resorption phase normally begins at least a year prior to exfoliation."},
    {q:"Which statement about the pattern of exfoliation is correct?",o:["Maxillary teeth generally precede the mandibular","Mandibular teeth generally precede the maxillary, except the second molars, where all four are usually lost simultaneously","Exfoliation is typically asymmetric between right and left","Second molars always exfoliate before first molars"],a:1,e:"Exfoliation usually occurs symmetrically right and left, and mandibular teeth generally precede the same maxillary teeth — with the second molar exception."},
    {q:"The mixed dentition period ends with the exfoliation of which teeth, at about what age?",o:["The deciduous canines, at about age 10","The deciduous second molars, at about age 12","The deciduous first molars, at about age 11","The deciduous lateral incisors, at about age 9"],a:1,e:"The series of events occurs over approximately six years and the mixed dentition period ends with the exfoliation of the deciduous second molars at about age 12."},
    {q:"A deciduous molar has become fused to the surrounding alveolar bone, eruption has ceased, and it is now well below the occlusal plane. This is:",o:["Incomplete resorption","Supraeruption","Ankylosis","Passive eruption"],a:2,e:"Ankylosis occurs most often with the deciduous molars. Resorption cannot progress naturally, and the tooth must be surgically removed as soon as it is diagnosed because it precludes proper eruption of the succedaneous tooth."},
    {q:"The customary treatment for a deciduous tooth that fails to exfoliate because of incomplete resorption is:",o:["Observation until the permanent tooth erupts","Extraction of the offending deciduous tooth","Pulpotomy of the deciduous tooth","Surgical exposure of the permanent tooth"],a:1,e:"Incomplete resorption forces the permanent tooth to erupt in an abnormal position or blocks it entirely; the practitioner diagnoses it and extracts the deciduous tooth."},
    {q:"Place these in developmental order: bell stage, bud stage, cap stage, dental lamina, root development.",o:["Bud, dental lamina, cap, bell, root development","Dental lamina, bud, cap, bell, root development","Dental lamina, cap, bud, bell, root development","Bud, cap, dental lamina, bell, root development"],a:1,e:"Dental lamina first at about six weeks prenatal, then bud, cap, bell, and finally root development beginning at the CEJ."},
    {q:"In which stage is the enamel knot present?",o:["Dental lamina and bud stages","Bud and cap stages","Cap and bell stages","Bell and root development stages"],a:1,e:"The enamel knot is located in the center of bud and cap stage tooth germs. The primary enamel knot forms at the cap stage, and secondary knots appear from the early bell stage in molars."},
    {q:"How long is the lag between eruption and root completion for PERMANENT teeth?",o:["One year","Two years","Three years","Five years"],a:2,e:"About three years for permanent teeth, versus about one year for the deciduous teeth."},
    {q:"Which structure is described as the signaling center that provides positional information for tooth morphogenesis and regulates the growth of tooth cusps?",o:["Hertwig's sheath","The enamel knot","The dental lamina","The enamel organ"],a:1,e:"The enamel knot. Hertwig's sheath is the epithelial root sheath from which root structure forms."}
  ]
},
{
  id:"maxinc", code:"07", title:"Maxillary Incisors",
  short:"Max Incisors",
  source:"Central and lateral incisors",
  blurb:"The first individual-tooth lecture. Chronology, measurements, and the outline of each of the five views for the maxillary central and lateral incisors.",
  sections:[
    {h:"Chronology", table:{head:["","Central incisor","Lateral incisor"],rows:[
      ["First evidence of calcification","3–4 months","1 year"],
      ["Enamel completion","4–5 years","4–5 years"],
      ["Eruption","7–8 years","8–9 years"],
      ["Root completion","10 years","11 years"]
    ]}},
    {h:"Average measurements", table:{head:["Dimension","Central incisor","Lateral incisor"],rows:[
      ["Cervicoincisal length of crown","10.5 mm","9 mm"],
      ["Length of root","13 mm","13 mm"],
      ["Mesiodistal diameter of crown","8.5 mm","6.5 mm"],
      ["Labiolingual diameter of crown","7 mm","6 mm"]
    ]},
    rules:["Note that both teeth are wider mesiodistally than labiolingually, and that the two roots are the same average length even though the crowns differ."]},
    {h:"General features — both incisors", rules:[
      "Four lobes: three facial and one lingual.",
      "Mamelons are present on the incisal ridge at eruption.",
      "The maxillary lateral incisor is similar to the central but is the most variant tooth in the dentition except for the third molars, and is often congenitally missing."
    ],
    defs:[
      ["Incisal ridge vs. incisal edge","An edge is an angle formed by the merging of two flat surfaces. It occurs when wear flattens the surface in a linguoincisal direction. The incisal edge is formed by the junction of the incisal surface and the labial surface."],
      ["Imbrication lines","Small ridges sometimes observed in the cervical third of the labial surface."]
    ]},
    {h:"Central incisor — labial view", rules:[
      "Trapezoidal, with the longest uneven side toward the incisal.",
      "Mesial outline — slightly convex, with the height of contour in the incisal third at the proximal contact.",
      "Distal outline — more convex than the mesial, with the height of contour at the junction of the incisal and middle thirds.",
      "The incisal edge is typically regular and straight.",
      "The mesioincisal angle approaches 90°, while the distoincisal angle is more rounded and convex than the mesioincisal.",
      "The cervical outline is convex toward the apex.",
      "The root tapers from the cervical line to a blunt apex, with the mesial and distal root outlines usually parallel in the cervical third. The root is usually straight, with a slight inclination to the distal.",
      "A line drawn through the center of the crown and root tends to parallel the mesial outline."
    ]},
    {h:"Central incisor — lingual view", rules:[
      "The external outline represents a mirror image of the facial view.",
      "Four convexities: the cingulum, the mesial marginal ridge, the distal marginal ridge, and the incisal ridge.",
      "One concavity: the lingual fossa, which is shallow.",
      "The cervical line is convex apically.",
      "The crown is narrower mesiodistally on the lingual than on the facial."
    ]},
    {h:"Central incisor — mesial view", rules:[
      "Wedge shape, a triangular crown form — true of all incisors.",
      "The incisal ridge is directly in line with the long axis of the tooth. A common variation has the incisal ridge displaced slightly to the lingual.",
      "The cervical line deviates about 3–4 mm.",
      "The height of contour is in the cervical third on both the facial and the lingual surfaces.",
      "The labial outline is slightly convex. The lingual outline is convex from the CEJ to the crest of curvature, then concave from the crest of curvature to the incisal surface.",
      "Faciolingual thickness appears greater in the incisal third due to the slope of the labial surface distolingually.",
      "The root is cone shaped with a blunt apex."
    ]},
    {h:"Central incisor — distal view", rules:[
      "A mirror image of the mesial in general outline.",
      "The cervical line curves incisally about 1 mm less than on the mesial.",
      "Faciolingual thickness appears greater in the incisal third due to the slope of the labial surface distolingually."
    ]},
    {h:"Central incisor — incisal view", rules:[
      "The incisal surface is centered over the root and maintains its width faciolingually from mesial to distal.",
      "The root surface is not visible from the incisal view.",
      "The labial surface is convex in the cervical third, while the incisal and middle thirds are relatively flat.",
      "Line angles are prominent when viewed from the incisal.",
      "IMPORTANT: the maxillary central is wider mesiodistally than labiolingually."
    ]},
    {h:"Lateral incisor — distinguishing points", rules:[
      "Four lobes with mamelons at eruption, similar in general form to the central incisor.",
      "The most variant tooth in the dentition except for the third molars, and often congenitally missing.",
      "Proximal contacts from the facial view: mesial contact at the junction of the incisal and middle thirds; distal contact in the middle third.",
      "IMPORTANT: like the central, the maxillary lateral is wider mesiodistally than labiolingually."
    ]},
    {h:"Worksheet quick reference", table:{head:["","Maxillary central","Maxillary lateral"],rows:[
      ["Tooth number (Universal)","8 & 9","7 & 10"],
      ["Eruption age","7–8 years","8–9 years"],
      ["Root completion age","10 years","11 years"],
      ["Mesial height of contour","Incisal third","Junction of incisal and middle third"],
      ["Distal height of contour","Junction of incisal and middle third","Middle third"],
      ["Facial height of contour","Cervical third","Cervical third"],
      ["Lingual height of contour","Cervical third","Cervical third"],
      ["Widest portion","Mesiodistally","Mesiodistally"],
      ["Proximal view geometric shape","Triangular","Triangular"],
      ["Facial & lingual view geometric shape","Trapezoidal","Trapezoidal"],
      ["Facial & lingual CEJ curvature","Curves toward the apex","Curves toward the apex"],
      ["Proximal CEJ curvature","Curves toward the incisal","Curves toward the incisal"],
      ["Number of roots","One","One"],
      ["Curvature of root","Straight, with slight inclination to the distal","Straight, with curvature in the apical toward the distal"],
      ["Axial position (root inclination)","Lingually & straight","Lingually & straight"]
    ]}}
  ],
  traps:[
    ["Incisal ridge vs. incisal edge","A newly erupted incisor has an incisal ridge. Wear in the linguoincisal direction flattens it, creating an incisal edge at the junction of the incisal and labial surfaces."],
    ["Mesial vs. distal outline of the central","The mesial outline is only slightly convex with its contact in the incisal third; the distal is more convex with its contact at the junction of the incisal and middle thirds. The mesioincisal angle approaches 90°, the distoincisal is rounded — this is how you tell right from left."],
    ["Four convexities, one concavity","On the lingual of the maxillary central: cingulum, mesial marginal ridge, distal marginal ridge and incisal ridge are the convexities; the shallow lingual fossa is the single concavity."],
    ["Wider mesiodistally than labiolingually","Both maxillary incisors. The lecture flags this twice as IMPORTANT, which usually means it appears on the exam."],
    ["Distal cervical line curves ~1 mm less","On any tooth the cervical line curvature is deeper on the mesial than on the distal; for the maxillary central the difference is about 1 mm."]
  ],
  questions:[
    {q:"First evidence of calcification of the maxillary central incisor occurs at:",o:["Birth","3–4 months","1 year","4–5 years"],a:1,e:"3–4 months for the central; the lateral is later, at 1 year. Enamel completion for both is 4–5 years."},
    {q:"The maxillary lateral incisor erupts at approximately:",o:["6–7 years","7–8 years","8–9 years","10–11 years"],a:2,e:"Lateral incisors erupt at 8–9 years and complete root formation at 11 years. Centrals erupt at 7–8 years with root completion at 10 years."},
    {q:"What is the average mesiodistal diameter of the crown of a maxillary central incisor?",o:["6.5 mm","7 mm","8.5 mm","10.5 mm"],a:2,e:"8.5 mm mesiodistally and 7 mm labiolingually. 10.5 mm is the cervicoincisal crown length and 6.5 mm is the lateral incisor's mesiodistal width."},
    {q:"Comparing the average root lengths of the maxillary central and lateral incisors:",o:["The central is longer","The lateral is longer","They are the same at 13 mm","They are the same at 10 mm"],a:2,e:"Both average 13 mm even though the crowns differ substantially in length and width."},
    {q:"How many lobes does a maxillary central incisor have?",o:["Three — all facial","Four — three facial and one lingual","Four — two facial and two lingual","Five — three facial and two lingual"],a:1,e:"Four lobes, three facial and one lingual, with mamelons present on the incisal ridge at eruption."},
    {q:"An incisal edge, as distinguished from an incisal ridge, is formed:",o:["At eruption, by the three mamelons","When wear flattens the surface in a linguoincisal direction","By the union of the marginal ridges","By the cingulum meeting the lingual fossa"],a:1,e:"An edge is an angle formed by the merging of two flat surfaces. It forms with wear, and the incisal edge is the junction of the incisal surface and the labial surface."},
    {q:"Imbrication lines are found:",o:["On the lingual surface near the cingulum","In the cervical third of the labial surface","Along the incisal ridge at eruption","In the lingual fossa"],a:1,e:"They are small ridges sometimes observed in the cervical third of the labial surface."},
    {q:"From the labial view, the height of contour of the distal outline of a maxillary central incisor is located:",o:["In the incisal third","At the junction of the incisal and middle thirds","In the middle third","In the cervical third"],a:1,e:"The distal outline is more convex than the mesial, with its height of contour at the junction of the incisal and middle thirds. The mesial contact sits higher, in the incisal third."},
    {q:"Which feature helps distinguish a right from a left maxillary central incisor?",o:["The mesioincisal angle approaches 90° while the distoincisal angle is more rounded","The mesial outline is more convex than the distal","The cingulum is displaced distally","The lingual fossa is deeper on the mesial half"],a:0,e:"The sharper, nearly 90° mesioincisal angle versus the rounded distoincisal angle is the standard right-left discriminator on this tooth."},
    {q:"From the labial view, the root of a maxillary central incisor is usually:",o:["Straight with a slight inclination to the mesial","Straight with a slight inclination to the distal","Sharply curved to the distal in the apical third","Bifurcated in the apical third"],a:1,e:"The root tapers to a blunt apex, with mesial and distal outlines usually parallel in the cervical third, and is usually straight with a slight distal inclination."},
    {q:"The lingual surface of a maxillary central incisor presents how many convexities and concavities?",o:["Three convexities and two concavities","Four convexities and one concavity","Two convexities and two concavities","Four convexities and two concavities"],a:1,e:"Four convexities — cingulum, mesial marginal ridge, distal marginal ridge, incisal ridge — and one concavity, the shallow lingual fossa."},
    {q:"Comparing the mesiodistal width of a maxillary central incisor crown on the lingual versus the facial:",o:["The lingual is wider","The lingual is narrower","They are equal","It varies with the individual"],a:1,e:"The crown is narrower mesiodistally on the lingual than on the facial, which is why the lingual view shows the proximal surfaces converging lingually."},
    {q:"From the mesial view, the crown of any incisor is described as:",o:["Trapezoidal","Rhomboidal","Wedge shaped and triangular","Ovoid"],a:2,e:"Wedge shape, a triangular crown form, is true of all incisors — base at the cervical, apex at the incisal."},
    {q:"From the mesial view of a maxillary central incisor, the incisal ridge normally lies:",o:["Distinctly labial to the long axis","Directly in line with the long axis of the tooth","Distinctly lingual to the long axis","At the level of the cingulum"],a:1,e:"Directly in line with the long axis. A common variation has the incisal ridge displaced slightly to the lingual."},
    {q:"From the mesial view, the lingual outline of a maxillary central incisor is:",o:["Uniformly convex from CEJ to incisal","Convex from the CEJ to the crest of curvature, then concave to the incisal surface","Uniformly concave from CEJ to incisal","Straight"],a:1,e:"The convex portion is the cingulum bulge; the concavity above it is the lingual fossa."},
    {q:"Where is the height of contour on the facial and lingual surfaces of a maxillary central incisor, viewed from the mesial?",o:["Cervical third on both","Cervical third facial, middle third lingual","Middle third on both","Incisal third facial, cervical third lingual"],a:0,e:"Cervical third on both surfaces, consistent with the general rules that facial heights of contour are cervical third on all teeth and anterior lingual heights of contour are also cervical third."},
    {q:"On the distal surface of a maxillary central incisor, the cervical line curves incisally:",o:["About 1 mm more than on the mesial","About 1 mm less than on the mesial","The same amount as on the mesial","It curves apically instead"],a:1,e:"About 1 mm less than the mesial. This follows the general rule that cervical line curvature is deeper on the mesial than the distal of any tooth."},
    {q:"From the incisal view of a maxillary central incisor:",o:["The root surface is clearly visible lingual to the crown","The labial surface is convex in the cervical third and relatively flat in the incisal and middle thirds","The crown is wider labiolingually than mesiodistally","The line angles are indistinct"],a:1,e:"The root is not visible from the incisal, line angles are prominent, and the crown is wider mesiodistally than labiolingually."},
    {q:"Which statement is emphasized as IMPORTANT for both maxillary incisors from the incisal view?",o:["They are wider labiolingually than mesiodistally","They are wider mesiodistally than labiolingually","The incisal surface is offset lingual to the root","The cingulum is centered mesiodistally"],a:1,e:"Both the maxillary central and the maxillary lateral are wider mesiodistally than labiolingually — the lecture flags this for each tooth."},
    {q:"Which tooth is described as the most variant in the dentition, apart from the third molars?",o:["Maxillary central incisor","Maxillary lateral incisor","Mandibular central incisor","Maxillary canine"],a:1,e:"The maxillary lateral incisor is the most variant tooth except for third molars, and it is often congenitally missing."},
    {q:"From the facial view, the mesial proximal contact of a maxillary lateral incisor is located:",o:["In the incisal third","At the junction of the incisal and middle thirds","In the middle third","In the cervical third"],a:1,e:"Mesial contact at the junction of the incisal and middle thirds; distal contact in the middle third. Note both sit more cervical than the corresponding contacts on the central."},
    {q:"A maxillary central incisor crown measures 10.5 mm cervicoincisally and the root 13 mm. A lateral incisor crown measures 9 mm. What is the lateral's average labiolingual crown diameter?",o:["6 mm","6.5 mm","7 mm","8.5 mm"],a:0,e:"The lateral averages 6.5 mm mesiodistally and 6 mm labiolingually. The central averages 8.5 mm and 7 mm respectively."},
    {q:"Which Universal numbers identify the maxillary lateral incisors?",o:["8 and 9","7 and 10","6 and 11","2 and 15"],a:1,e:"7 and 10. The maxillary centrals are 8 and 9, and the maxillary canines are 6 and 11."},
    {q:"The axial position of both maxillary incisors is described as:",o:["Lingually inclined, and straight in the mesiodistal direction","Facially inclined, and distally inclined","Lingually inclined, and mesially inclined","Straight in both directions"],a:0,e:"Maxillary anterior roots incline toward the lingual, and incisor roots are nearly straight in the mesiodistal direction — the canine is the one that inclines distally."},
    {q:"On the facial and lingual surfaces of a maxillary incisor, the CEJ curves toward the:",o:["Incisal","Apex","Mesial","Distal"],a:1,e:"Toward the apex on the facial and lingual, and toward the incisal on the proximal surfaces — the general cervical line rule applied to this tooth."},
    {q:"Comparing the mesial height of contour of the maxillary central and lateral incisors:",o:["Both are in the incisal third","Central in the incisal third, lateral at the junction of incisal and middle third","Central at the junction of incisal and middle third, lateral in the incisal third","Both are at the junction of incisal and middle third"],a:1,e:"The central's mesial contact is in the incisal third; the lateral's is one step more cervical, at the junction of the incisal and middle third. Contacts move cervically as you go posteriorly."},
    {q:"The distal height of contour of a maxillary LATERAL incisor is located in the:",o:["Incisal third","Junction of incisal and middle third","Middle third","Cervical third"],a:2,e:"Middle third on the lateral. On the central, the distal height of contour sits at the junction of the incisal and middle third."}
  ]
},
{

    {h:"Mandibular central — general form", rules:[

      "Centrals are slightly smaller than laterals.",

    {h:"Mandibular central — facial view", rules:[

      "Mesioincisal angle sharp; distoincisal angle also sharp.",
      "Height of contour on the proximal surfaces is in the incisal third, near the edge.",

      "The lingual is relatively smooth with less prominent features compared with the maxillary, and the lingual fossa is shallow.",

    {h:"Mandibular central — incisal view", rules:[

      "The lingual surface converges toward the center, giving a triangular shape.",
      "The incisal ridge runs more or less straight across.",
      "Wider labiolingually than mesiodistally.",
      "Bilateral symmetry — the mesial half is identical to the distal half.",
      "More labial surface is visible than lingual."
    ]},
    {h:"Mandibular central — root anatomy", rules:[

      "The root is slightly longer than the crown.",
      "The lingual root surface tapers, or is narrower, than the labial.",
      "Slight mesial root concavity, with a more pronounced root concavity on the distal."

    {h:"Mandibular lateral — chronology", table:{head:["Event","Age"],rows:[

      ["Eruption","7–8 years"],
      ["Root completion","10 years"]

    {h:"Mandibular lateral — distinguishing features", rules:[
      "Four lobes — three facial, one lingual, with mamelons at eruption. Deeper developmental grooves separate the developmental lobes.",

      "The incisal margin may slope slightly gingival toward the distal, and the distoincisal angle is more rounded.",
