<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Courses &middot; SOD 2030</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Public+Sans:wght@400;500;600&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<style>
  .soon { color:var(--muted); font-style:italic; }
  .link-list .soon-row { display:flex; justify-content:space-between; gap:1rem; padding:.8rem .25rem; color:var(--muted); }
  .d-code { font-weight:600; color:var(--ink); }

  /* ---- Archive dropdown (shared look on Study Guides + Courses) ---- */
  .archive { margin-top:2.8rem; border-top:1px solid var(--line); padding-top:1.3rem; }
  .archive > summary,
  .archive-term > summary {
    cursor:pointer; list-style:none;
    display:flex; align-items:baseline; gap:.6rem;
    font-family:var(--font-display); font-weight:600;
  }
  .archive > summary::-webkit-details-marker,
  .archive-term > summary::-webkit-details-marker { display:none; }
  .archive > summary::before,
  .archive-term > summary::before {
    content:"\25B8"; display:inline-block; color:var(--muted);
    font-size:.85em; transition:transform .15s ease;
  }
  .archive[open] > summary::before,
  .archive-term[open] > summary::before { transform:rotate(90deg); }
  .arch-label { font-size:1.15rem; }
  .arch-count { font-family:var(--font-body); font-weight:400; font-size:.85rem; color:var(--muted); }
  .archive-term {
    margin:1rem 0 0; padding:.55rem 0 .3rem 1rem;
    border-left:2px solid var(--line);
  }
  .archive-term > summary { font-size:1rem; color:var(--muted); }
  .archive .guide-course { margin-top:1.3rem; }
  .archive .guide-course h2 { font-size:1rem; }
  .archive .guide { border-left-color:var(--line); }
  .archive .grid { margin:1rem 0 .4rem; }
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<header class="site-head" data-head></header>
<main id="content">
  <p class="eyebrow">D1 fall</p>
  <h1>Courses</h1>
  <p class="lead">Every D1 fall course with its director, format, and grading.</p>

  <div class="grid" data-courses></div>

  <section data-courses-archive></section>
</main>
<footer class="site-foot" data-foot></footer>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
